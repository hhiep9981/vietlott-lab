<title>Vietlott Lab</title>

  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-1-soft: #cde2fb;
  --series-2: #eb6834;
  --ref: #52514e;
  --div-neg-2: #184f95; --div-neg-1: #86b6ef; --div-mid: #f0efec;
  --div-pos-1: #f3a9a8; --div-pos-2: #b8302f;

  --ball: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {

    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-1-soft: #104281; --series-2: #d95926; --ref: #c3c2b7;
    --div-neg-2: #6da7ec; --div-neg-1: #1c5cab; --div-mid: #383835;
    --div-pos-1: #9b2f2e; --div-pos-2: #f08b8a;
    --good-text: #0ca30c; --ball: #262624;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-1-soft: #104281; --series-2: #d95926; --ref: #c3c2b7;
  --div-neg-2: #6da7ec; --div-neg-1: #1c5cab; --div-mid: #383835;
  --div-pos-1: #9b2f2e; --div-pos-2: #f08b8a;
  --good-text: #0ca30c; --ball: #262624;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 64px; }
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--page);
  border-bottom: 1px solid var(--border);
}
.top-inner {
  max-width: 1280px; margin: 0 auto; padding: 12px 16px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.brand { font-weight: 650; font-size: 16px; margin-right: auto; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab, .seg button, .theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit;
}
.tab[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--ink); color: var(--page); border-color: var(--ink);
}
.theme-btn { padding: 6px 10px; }
.notice {
  margin: 20px 0 8px; padding: 12px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
}
.notice b { color: var(--ink); }
h2 { font-size: 18px; margin: 36px 0 4px; font-weight: 650; }
h2 + p.lede { margin: 0 0 14px; color: var(--ink-2); max-width: 820px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.grid.tiles { grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; min-width: 0;
}
.card.wide { grid-column: 1 / -1; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .sub { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
.card-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 4px; }
.seg button { padding: 3px 10px; font-size: 12.5px; }
.chart { width: 100%; height: 300px; }
.chart.tall { height: 420px; }
.chart.sq { height: 520px; }
.tile .label { color: var(--ink-2); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.verdict.ok { color: var(--good-text); }
.verdict.bad { color: var(--critical); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.balls { display: flex; gap: 6px; flex-wrap: wrap; }
.ball {
  width: 34px; height: 34px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; font-weight: 600;
  border: 1.5px solid var(--series-1); background: var(--ball); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ball.sp { border-color: var(--div-pos-2); }
.ball.sm { width: 26px; height: 26px; font-size: 12px; }
.ticket { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.ticket:last-child { border-bottom: 0; }
.ticket .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
ul.facts { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); }
ul.facts li { margin: 4px 0; }
.legend-inline { display: flex; gap: 14px; color: var(--ink-2); font-size: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.line { height: 2px; vertical-align: 3px; }
.views { display: flex; gap: 2px; flex-wrap: wrap; }
.view-btn {
  border: 0; background: none; color: var(--ink-2); padding: 6px 10px; border-radius: 8px;
  cursor: pointer; font: inherit; font-weight: 550;
}
.view-btn[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.sub-bar { max-width: 1280px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub-bar .label { color: var(--muted); font-size: 12.5px; }
.ball.hit { background: var(--series-1); color: #fff; }
.ball.click, [data-ticket] { cursor: pointer; }
[data-ticket]:hover .ball { box-shadow: 0 0 0 2px var(--series-1-soft); }
.minitabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 12px; }
.minitabs button {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit;
}
.minitabs button[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 13px; }
input[type="text"], input[type="number"], select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-width: 0;
}
input[type="text"] { width: min(100%, 320px); }
input[type="number"] { width: 84px; }
button.primary {
  font: inherit; font-weight: 600; border: 1px solid var(--ink); background: var(--ink); color: var(--page);
  padding: 7px 16px; border-radius: 8px; cursor: pointer;
}
button.primary[disabled] { opacity: .5; cursor: default; }
button.ghost { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.progress { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.wgrid { display: grid; gap: 6px 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.wgrid label { display: grid; grid-template-columns: 150px 1fr 48px; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.wgrid input[type="range"] { width: 100%; accent-color: var(--series-1); }
.wgrid output { text-align: right; font-variant-numeric: tabular-nums; }
.progress > div { height: 100%; background: var(--series-1); width: 0; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.err { color: var(--critical); }
.muted { color: var(--muted); }
dialog#ticket-dlg {
  width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
  border: 1px solid var(--border); border-radius: 14px; background: var(--page); color: var(--ink);
}
dialog#ticket-dlg::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { position: sticky; top: 0; background: var(--page); padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: center; z-index: 1; }
.dlg-body { padding: 4px 16px 20px; }
.dlg-body h3 { font-size: 15px; margin: 18px 0 6px; }
.info h2 { margin-top: 28px; }
.info p, .info li { color: var(--ink-2); max-width: 860px; }
.info dt { font-weight: 600; margin-top: 10px; }
.info dd { margin: 2px 0 0 0; color: var(--ink-2); max-width: 860px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.toc a { color: var(--ink-2); text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 13px; background: var(--surface); }
footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
a { color: var(--series-1); }
@media (max-width: 600px) {
  .chart { height: 260px; } .chart.sq { height: 380px; }
  .tile .value { font-size: 22px; }
  header.top { position: static; }
  .top-inner { padding: 10px 16px 6px; gap: 6px; }
  .brand { width: calc(100% - 52px); }
  .brand small { display: block; margin-left: 0; }
  #theme { order: 1; }
  .views { order: 2; width: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .view-btn { white-space: nowrap; padding: 6px 8px; }
  .sub-bar .label { display: none; }
  .sub-bar .tabs { flex-wrap: nowrap; overflow-x: auto; }
  .tab { white-space: nowrap; }
}
</style>

const charts = [];

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (x, d = 0) => x == null || Number.isNaN(x) ? "–" : Number(x).toLocaleString("vi-VN", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (x, d = 1) => x == null ? "–" : fmt(x * 100, d) + "%";
const sign = (v, d = 2) => (v >= 0 ? "+" : "") + fmt(v, d);
const vnd = (x) => {
  const a = Math.abs(x), s = x < 0 ? "−" : "";
  if (a >= 1e9) return s + fmt(a / 1e9, a % 1e9 ? 1 : 0) + " tỷ";
  if (a >= 1e6) return s + fmt(a / 1e6, a % 1e6 ? 1 : 0) + " triệu";
  return s + fmt(a) + "đ";
};
const pval = (p) => p < 0.001 ? "<0,001" : fmt(p, 3);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- charts ---------- */
function baseOption() {
  return {
    animation: false,
    textStyle: { fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif', color: css("--ink-2") },
    grid: { left: 8, right: 16, top: 24, bottom: 8, containLabel: true },
    tooltip: {
      trigger: "axis", confine: true,
      backgroundColor: css("--surface"), borderColor: css("--border"),
      textStyle: { color: css("--ink"), fontSize: 12 },
      axisPointer: { type: "shadow", shadowStyle: { color: css("--grid"), opacity: 0.5 } },
    },
  };
}
function axis(extra = {}) {
  return Object.assign({
    axisLine: { lineStyle: { color: css("--axis") } },
    axisTick: { show: false },
    axisLabel: { color: css("--muted"), fontSize: 11 },
    splitLine: { lineStyle: { color: css("--grid"), width: 1 } },
    nameTextStyle: { color: css("--muted"), fontSize: 11 },
  }, extra);
}
function disposeChart(id) {
  const i = charts.findIndex((c) => c.getDom().id === id);
  if (i >= 0) charts.splice(i, 1)[0].dispose();
}
function mk(id, option) {
  const el = document.getElementById(id);
  if (!el) return null;
  disposeChart(id);
  const c = echarts.init(el, null, { renderer: "svg" });
  const base = baseOption();
  c.setOption(Object.assign(base, option, { tooltip: Object.assign(base.tooltip, option.tooltip || {}) }));
  charts.push(c);
  return c;
}
function disposeAll() { charts.splice(0).forEach((c) => c.dispose()); }
const barStyle = (color = "--series-1") => ({ color: css(color), borderRadius: [4, 4, 0, 0] });
const refLine = (value, label) => ({

  label: { formatter: label, color: css("--ink-2"), fontSize: 11, position: "insideEndTop" },
  data: [{ yAxis: value }],

/* bar of observed counts with scalar or per-category expected */
function obsVsExp(id, cats, obs, exp, opts = {}) {
  const series = [{
    name: opts.obsName || "Quan sát", type: "bar", data: obs, barCategoryGap: "20%",
    itemStyle: barStyle(),
  }];
  if (Array.isArray(exp)) {
    series.push({
      name: "Kỳ vọng (ngẫu nhiên)", type: "line", data: exp, symbol: "circle", symbolSize: 8,
      lineStyle: { color: css("--ref"), width: 2 }, itemStyle: { color: css("--ref"), borderColor: css("--surface"), borderWidth: 2 },
    });
  } else if (exp != null) {
    series[0].markLine = refLine(exp, "Kỳ vọng " + fmt(exp, 1));
  }
  return mk(id, {
    xAxis: axis({ type: "category", data: cats, name: opts.xName, nameLocation: "middle", nameGap: 26, splitLine: { show: false } }),
    yAxis: axis({ type: "value", name: opts.yName, min: opts.yMin }),
    series,
    tooltip: opts.tooltip || {},

}
function divergingMap(min, max, dim) {
  return {
    min, max, calculable: false, orient: "horizontal", left: "center", bottom: 0,
    dimension: dim, itemWidth: 12, itemHeight: 160,
    textStyle: { color: css("--muted"), fontSize: 11 },

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const memStore = {};
function store(k, v) {
  if (v === undefined) {
    try { const x = localStorage.getItem(k); if (x !== null) return x; } catch (e) {}
    return memStore[k] ?? null;
  }
  memStore[k] = v;
  try { localStorage.setItem(k, v); } catch (e) {}
  return null;
}

/* ---------- seeded RNG ---------- */
function hash32(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}
function mulberry32(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seededRng = (seed) => mulberry32(hash32(String(seed)));
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* k distinct items from `items` (default 1..n) uniformly */
function sampleUniform(rng, items, k) { return shuffle(rng, items).slice(0, k); }

/* ---------- maths ---------- */
function comb(n, k) {
  if (k < 0 || k > n) return 0;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
  return r;
}
const hypergeom = (pool, drawn, pick, m) => comb(drawn, m) * comb(pool - drawn, pick - m) / comb(pool, pick);
const normSf = (z) => 0.5 * erfc(z / Math.SQRT2);
function erfc(x) { // Numerical Recipes erfcc
  const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
  const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return x >= 0 ? r : 2 - r;
}

/* model.js — lotto game model shared by Pool, Backtest and the ticket popup:
   draws, prize table and walk-forward state (frequency z, hot/cold classes,
   shape rules, composition profiles). Only 6/55, 6/45, 5/35. */
const RECENT_WINDOW = 150;
const PROFILE_WARMUP = 30;
const models = {};

function getModel(key) {
  if (models[key]) return models[key];
  const G = DATA.games[key];
  const H = G.history;
  const draws = H.main.map((m, i) => ({ date: H.dates[i], id: H.ids[i], main: m, special: H.special[i] > 0 ? H.special[i] : null }));
  const specialType = key === "power655" ? "bonus" : key === "power535" ? "separate" : null;
  const m = {
    key, name: G.meta.name, pool: G.meta.pool, pick: G.meta.drawn, specialType,
    specialPool: specialType === "separate" ? 12 : 0, draws, tiers: G.value.tiers,
  };
  m.prize = prizeTable(m);
  m.final = new LottoState(m);
  draws.forEach((d) => m.final.update(d));
  models[key] = m;
  return m;
}

/* prize[matches][specialHit ? 1 : 0] from the official tiers */
function prizeTable(m) {
  const t = Array.from({ length: m.pick + 1 }, () => [0, 0]);
  for (let k = 0; k <= m.pick; k++) for (const s of [false, true]) {
    const exact = m.tiers.find((x) => x.matches === k && x.special === s);
    const any = m.tiers.find((x) => x.matches === k && x.special === null);
    t[k][s ? 1 : 0] = (exact || any || { prize: 0 }).prize;
  }
  return t;
}
function scoreTicket(m, draw, ticket) {
  const set = new Set(draw.main);
  const matches = ticket.numbers.reduce((a, v) => a + (set.has(v) ? 1 : 0), 0);
  let sHit = false;
  if (m.specialType === "bonus") sHit = draw.special != null && ticket.numbers.includes(draw.special);
  else if (m.specialType === "separate") sHit = ticket.special === draw.special;
  return { matches, sHit, prize: m.prize[matches][sHit ? 1 : 0] };
}

/* ---------- walk-forward state ---------- */
class LottoState {
  constructor(m) {
    this.m = m;
    const N = m.pool;
    this.t = 0;
    this.countsAll = new Float64Array(N);
    this.countsRecent = new Float64Array(N);
    this.recent = [];
    this.last = null;
    this.history = new Set();
    this.maxGapHist = new Array(N + 1).fill(0);
    this.adjHist = new Array(m.pick + 1).fill(0);
    this.spCounts = new Float64Array(Math.max(m.specialPool, 1));
    this.spN = 0;
    this.profiles = new Map();
    this._cache = null;
  }
  update(d) {
    const N = this.m.pool;
    if (this.t >= PROFILE_WARMUP && this.last) {
      const k = profileOf(this, d.main).key;
      this.profiles.set(k, (this.profiles.get(k) || 0) + 1);
    }
    for (const v of d.main) { this.countsAll[v - 1]++; this.countsRecent[v - 1]++; }
    this.recent.push(d.main);
    if (this.recent.length > RECENT_WINDOW) for (const v of this.recent.shift()) this.countsRecent[v - 1]--;
    this.history.add(d.main.join("-"));
    const g = gapsOf(d.main);
    if (g.length) { this.maxGapHist[Math.min(Math.max(...g), N)]++; this.adjHist[Math.min(g.filter((x) => x === 1).length, this.m.pick)]++; }
    if (this.m.specialType === "separate" && d.special) { this.spCounts[d.special - 1]++; this.spN++; }
    this.last = d.main;
    this.t++;
    this._cache = null;
  }
  get cache() {
    if (this._cache) return this._cache;
    const N = this.m.pool, p = this.m.pick / N;
    const z = (counts, n) => Array.from(counts, (c) => (n ? (c - n * p) / Math.sqrt(n * p * (1 - p)) : 0));
    const za = z(this.countsAll, this.t), zr = z(this.countsRecent, this.recent.length);
    const freqZ = za.map((v, i) => 0.5 * (v + zr[i]));
    const order = freqZ.map((v, i) => [v, i + 1]).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
    const third = Math.floor(N / 3);
    const cls = new Int8Array(N + 1);
    order.slice(0, third).forEach((v) => (cls[v] = 1));
    order.slice(N - third).forEach((v) => (cls[v] = -1));
    let spZ = null;
    if (this.m.specialType === "separate") {
      const q = 1 / this.m.specialPool, n = this.spN;
      spZ = Array.from(this.spCounts, (c) => (n ? (c - n * q) / Math.sqrt(n * q * (1 - q)) : 0));
    }
    const profiles = [...this.profiles.entries()].sort((a, b) => b[1] - a[1]);
    const profTotal = profiles.reduce((a, x) => a + x[1], 0);
    this._cache = { freqZ, zAll: za, zRecent: zr, cls, spZ, profiles, profTotal, rules: this.computeRules() };
    return this._cache;
  }
  computeRules() {
    const N = this.m.pool, k = this.m.pick;
    const mean = k * (N + 1) / 2, sd = Math.sqrt(k * (N - k) * (N + 1) / 12), zq = 1.2815516;
    const hg = (good) => Array.from({ length: k + 1 }, (_, i) => comb(good, i) * comb(N - good, k - i) / comb(N, k));
    const pctl = (hist, q, def) => {
      const tot = hist.reduce((a, b) => a + b, 0);
      if (tot < 30) return def;
      let c = 0;
      for (let i = 0; i < hist.length; i++) { c += hist[i]; if (c >= q * tot) return i; }
      return hist.length - 1;
    };
    return {
      sum_lo: mean - zq * sd, sum_hi: mean + zq * sd, sum_mean: mean, sum_sd: sd,
      odd_ok: centralValues(hg(Math.floor((N + 1) / 2))), low_ok: centralValues(hg(Math.floor(N / 2))),
      low_max: Math.floor(N / 2),
      max_gap: pctl(this.maxGapHist, 0.95, N), max_adjacent: pctl(this.adjHist, 0.9, k),
    };
  }
}
function centralValues(probs, mass = 0.8) {
  const order = probs.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]);
  const out = [];
  let c = 0;
  for (const [p, i] of order) { out.push(i); c += p; if (c >= mass) break; }
  return out.sort((a, b) => a - b);
}
const gapsOf = (t) => t.slice(1).map((v, i) => v - t[i]);
const overlapCount = (a, b) => { const s = new Set(a); return b.reduce((x, v) => x + (s.has(v) ? 1 : 0), 0); };
function passesRules(t, R) {
  const sum = t.reduce((a, b) => a + b, 0);
  const odd = t.filter((v) => v % 2).length;
  const low = t.filter((v) => v <= R.low_max).length;
  const g = gapsOf(t);
  return sum >= R.sum_lo && sum <= R.sum_hi && R.odd_ok.includes(odd) && R.low_ok.includes(low)
    && Math.max(...g) <= R.max_gap && g.filter((x) => x === 1).length <= R.max_adjacent;
}
/* composition of a ticket relative to the state BEFORE it is drawn */
function profileOf(st, nums) {
  const { cls } = st.cache;
  let h = 0, c = 0, mid = 0;
  for (const v of nums) { if (cls[v] === 1) h++; else if (cls[v] === -1) c++; else mid++; }
  const r = st.last ? overlapCount(st.last, nums) : 0;
  const a = gapsOf(nums).filter((x) => x === 1).length;
  return { h, c, mid, r, a, key: `${h}|${c}|${mid}|${r}|${a}` };
}
const profileLabel = (p) => `${p.h} nóng · ${p.c} lạnh · ${p.mid} TB · ${p.r} lặp kỳ trước · ${p.a} cặp liền`;

const range1 = (n) => Array.from({ length: n }, (_, i) => i + 1);

/* popup.js — click any ball group ([data-ticket]) to analyse that ticket. */
const simCache = {};

function ticketFeatures(m, nums) {
  const g = gapsOf(nums);
  let run = 1, best = 1;
  for (const x of g) { run = x === 1 ? run + 1 : 1; best = Math.max(best, run); }
  const digits = new Set(nums.map((v) => v % 10));
  const decades = new Set(nums.map((v) => Math.floor((v - 1) / 10)));
  let mult = 0;
  for (let q = Math.floor(m.pool / m.pick); q >= 2; q--) if (nums.every((v) => v % q === 0)) { mult = q; break; }
  return {
    sum: nums.reduce((a, b) => a + b, 0),
    odd: nums.filter((v) => v % 2).length,
    low: nums.filter((v) => v <= Math.floor(m.pool / 2)).length,
    adj: g.filter((x) => x === 1).length,
    maxGap: Math.max(...g),
    longestRun: best,
    ap: new Set(g).size === 1,
    sameDigit: digits.size === 1,
    sameDecade: decades.size === 1,
    mult,
    allParity: nums.every((v) => v % 2) || nums.every((v) => v % 2 === 0),
    gaps: g,
  };
}
/* shape distribution of uniformly random tickets (Monte-Carlo, cached) */
function simShapes(m, n = 20000) {
  if (simCache[m.key]) return simCache[m.key];
  const rng = seededRng("sim|" + m.key);
  const all = range1(m.pool);
  const rows = [];
  for (let i = 0; i < n; i++) rows.push(ticketFeatures(m, sampleUniform(rng, all, m.pick).sort((a, b) => a - b)));
  simCache[m.key] = rows;
  return rows;
}
const share = (rows, f) => rows.reduce((a, r) => a + (f(r) ? 1 : 0), 0) / rows.length;
// "1 in N" for how often a fair draw leaves a number out this long.
const rarity = (p) => (p >= 0.5 ? "Thường gặp" : p > 0 ? `1/${fmt(Math.round(1 / p))} lần` : "< 1/100.000 lần");
const oneIn = (p) => (p > 0 ? `≈ 1/${fmt(1 / p, p > 0.01 ? 1 : 0)}` : "< 1/20.000");

function openTicket(key, nums, special = null, ctx = null) {
  if (!LOTTO.includes(key)) return;
  const m = getModel(key), G = DATA.games[key], st = m.final, C = st.cache, R = C.rules;
  nums = [...nums].sort((a, b) => a - b);
  const f = ticketFeatures(m, nums);
  const sim = simShapes(m);
  const sumZ = (f.sum - R.sum_mean) / R.sum_sd;
  const F = G.frequency, Gp = G.gaps;
  const last = new Set(st.last || []);
  const clsLabel = (v) => (C.cls[v] === 1 ? "Nóng" : C.cls[v] === -1 ? "Lạnh" : "Trung bình");

  // history overlaps
  const byOverlap = new Array(m.pick + 1).fill(0);
  const close = [];
  m.draws.forEach((d, i) => {
    const k = overlapCount(d.main, nums);
    byOverlap[k]++;
    if (k >= m.pick - 2) close.push([i, k]);
  });
  close.sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  const nD = m.draws.length;

  const patterns = [];
  if (f.ap) patterns.push(["Cấp số cộng", share(sim, (r) => r.ap)]);
  if (f.longestRun >= 3) patterns.push([`Chuỗi ${f.longestRun} số liên tiếp`, share(sim, (r) => r.longestRun >= f.longestRun)]);
  if (f.sameDigit) patterns.push(["Cùng chữ số tận cùng", share(sim, (r) => r.sameDigit)]);
  if (f.sameDecade) patterns.push(["Cùng một nhóm 10 số", share(sim, (r) => r.sameDecade)]);
  if (f.mult) patterns.push([`Toàn bội số của ${f.mult}`, share(sim, (r) => r.mult >= 2)]);
  if (f.allParity) patterns.push([f.odd === m.pick ? "Toàn số lẻ" : "Toàn số chẵn", share(sim, (r) => r.allParity)]);
  const prof = st.last ? profileOf(st, nums) : null;
  const profN = prof ? st.profiles.get(prof.key) || 0 : 0;

  const pJack = 1 / comb(m.pool, m.pick) / (m.specialType === "separate" ? m.specialPool : 1);
  const shapeRows = [
    ["Tổng", `${f.sum} (z ${sign(sumZ)})`, share(sim, (r) => Math.abs((r.sum - R.sum_mean) / R.sum_sd) >= Math.abs(sumZ) - 1e-9), "lệch khỏi trung bình ít nhất như vậy"],
    ["Số lẻ / chẵn", `${f.odd} / ${m.pick - f.odd}`, share(sim, (r) => r.odd === f.odd), "đúng số lẻ này"],
    [`Số nhỏ (≤ ${R.low_max}) / lớn`, `${f.low} / ${m.pick - f.low}`, share(sim, (r) => r.low === f.low), "đúng số nhỏ này"],
    ["Cặp số liền nhau", `${f.adj}`, share(sim, (r) => r.adj === f.adj), "đúng số cặp này"],
    ["Khoảng cách lớn nhất", `${f.maxGap}`, Math.min(share(sim, (r) => r.maxGap >= f.maxGap), share(sim, (r) => r.maxGap <= f.maxGap)), "khoảng cách lớn nhất cực đoan ít nhất như vậy (phía hiếm hơn)"],
    ["Số lặp từ kỳ gần nhất", `${nums.filter((v) => last.has(v)).length}`, hypergeom(m.pool, m.pick, m.pick, nums.filter((v) => last.has(v)).length), "đúng số lặp này (siêu bội)"],
  ];

function initPopup() {
  const dlg = document.getElementById("ticket-dlg");
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  const handler = (e) => {
    const el = e.target.closest("[data-ticket]");
    if (!el || (e.type === "keydown" && e.key !== "Enter")) return;
    const nums = el.dataset.ticket.split("-").map(Number);
    const ctx = el.dataset.date ? { date: el.dataset.date, id: el.dataset.id } : null;
    openTicket(state.game, nums, el.dataset.sp ? Number(el.dataset.sp) : null, ctx);
  };
  document.addEventListener("click", handler);
  document.addEventListener("keydown", handler);
}

/* analysis.js — "Phân tích" view: frequency, gaps, pairs, structure, waiting
   times, heatmap, special number, randomness tests, backtest, expected value. */
function renderAnalysis(key) {

  const isKeno = key === "keno";

    const w = G.value.rtp_table.reduce((a, r) => (r.rtp < a.rtp ? r : a));

  <h2>Tần suất xuất hiện</h2>

    ${G.value.rtp_table.map((r) => `<tr><td>${r.spot}</td><td class="num">${pct(r.rtp)}</td><td class="num">${pct(r.p_any_prize)}</td><td class="num">${vnd(r.top_prize)}</td><td class="num">1/${fmt(1 / r.p_top)}</td></tr>`).join("")}

  : `<p class="lede">Tiền thưởng kỳ vọng mỗi vé tăng theo giá trị Jackpot. Vé chỉ "đáng giá" (kỳ vọng ≥ giá vé) khi Jackpot vượt mức hòa vốn — và ngay cả khi đó vẫn có rủi ro phải chia giải.</p>
    <div class="grid">${card("c-ev", "Hoàn trả kỳ vọng theo giá trị Jackpot (sau thuế)", `Hòa vốn khi Jackpot ≈ ${vnd(G.value.breakeven_jackpot)}.`)}
    <div class="card scroll"><h3>Cơ cấu giải &amp; xác suất</h3><table><thead><tr><th>Điều kiện</th><th class="num">Giải thưởng</th><th class="num">Xác suất</th></tr></thead><tbody>
    ${G.value.tiers.map((t) => `<tr><td>${t.matches} số${t.special === true ? " + số ĐB" : ""}${key === "power535" && t.matches < 3 ? " (trùng số ĐB)" : ""}</td><td class="num">${vnd(t.prize)}${t.prize >= 1e9 ? "+" : ""}</td><td class="num">1/${fmt(t.odds)}</td></tr>`).join("")}
    </tbody></table></div></div>`}

  <h2>Kết quả gần nhất</h2>
  ${isKeno ? `<div class="card scroll"><table><thead><tr><th>Ngày</th><th>Kỳ</th><th>Bộ số</th></tr></thead><tbody>
  ${G.recent_draws.slice(0, 15).map((d) => `<tr><td>${d.date}</td><td>#${d.id}</td><td>${ballsHtml(d.main, d.special, { click: false })}</td></tr>`).join("")}
  </tbody></table></div>` : recentVsPoolHtml(key, G)}`;

  document.getElementById("app").innerHTML = html;
  drawAnalysisCharts(key, G);
  if (!isKeno) drawRankChart(key, G);
}

function drawAnalysisCharts(key, G) {
  const M = G.meta;
  const nums = G.frequency.numbers;
  const isKeno = key === "keno";

  const drawFreq = (mode) => {
    const F = G.frequency;
    const obs = mode === "all" ? F.all : F.recent;
    const exp = mode === "all" ? F.all_expected : F.recent_expected;
    document.getElementById("freq-sub").textContent = mode === "all"
      ? `${fmt(M.n_draws)} kỳ · kỳ vọng ${fmt(exp, 1)} lần/số`
      : `${fmt(F.recent_n)} kỳ gần nhất · kỳ vọng ${fmt(exp, 1)} lần/số`;
    obsVsExp("c-freq", nums, obs, exp, {
      tooltip: { formatter: (p) => `Số <b>${p[0].name}</b><br>${p[0].value} lần · ${sign(p[0].value / exp * 100 - 100, 1)}% so với kỳ vọng${mode === "recent" ? `<br>z = ${fmt(F.recent_z[p[0].dataIndex], 2)}` : ""}` },
    });
  };
  drawFreq("all");
  bindSeg("freq-seg", drawFreq);

  const Gp = G.gaps;
  obsVsExp("c-gapcur", nums, Gp.current, Gp.expected_mean, {
    tooltip: { formatter: (p) => { const i = p[0].dataIndex; return `Số <b>${p[0].name}</b><br>Chưa về: ${Gp.current[i]} kỳ<br>TB khoảng cách: ${fmt(Gp.mean[i], 1)} · lớn nhất: ${Gp.max[i]}<br>Vắng lâu cỡ này: ${rarity(Gp.p_absent[i])}`; } },
  });
  obsVsExp("c-gaphist", Gp.hist_k.map((k, i) => (i === Gp.hist_k.length - 1 ? "≥" + k : String(k))), Gp.hist_obs, Gp.hist_exp, { xName: "Khoảng cách (kỳ)" });

  if (G.waiting) {
    for (const [id, k] of [["c-wait-adj", "adjacent"], ["c-wait-rep", "repeat"]]) {
      const w = G.waiting[k];
      obsVsExp(id, w.hist_k.map((x, i) => (i === w.hist_k.length - 1 ? "≥" + x : String(x))), w.hist_obs, w.hist_exp, {
        xName: "Số kỳ chờ",
        tooltip: { formatter: (p) => `Chờ <b>${p[0].name}</b> kỳ<br>Quan sát: ${fmt(p[0].value)} lần${p[1] ? `<br>Kỳ vọng: ${fmt(p[1].value, 1)}` : ""}` },
      });
    }
  }

  const P = G.pairs.ratio;
  const cells = [];
  for (let i = 0; i < P.length; i++) for (let j = 0; j < P.length; j++) if (P[i][j] != null) cells.push([j, i, P[i][j]]);
  const spread = isKeno ? 0.08 : 0.8;
  mk("c-pairs", {
    grid: { left: 8, right: 8, top: 8, bottom: 48, containLabel: true },
    tooltip: { trigger: "item", formatter: (p) => `Cặp <b>${nums[p.value[1]]} – ${nums[p.value[0]]}</b><br>${fmt(p.value[2] * G.pairs.expected, 0)} lần (×${fmt(p.value[2], 2)} kỳ vọng)` },
    xAxis: axis({ type: "category", data: nums, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 9, interval: isKeno ? 9 : 4 } }),
    yAxis: axis({ type: "category", data: nums, inverse: true, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 9, interval: isKeno ? 9 : 4 } }),
    visualMap: Object.assign(divergingMap(1 - spread, 1 + spread, 2), { text: [`×${fmt(1 + spread, 2)}`, `×${fmt(1 - spread, 2)}`] }),
    series: [{ type: "heatmap", data: cells, progressive: 0, itemStyle: { borderColor: css("--surface"), borderWidth: isKeno ? 0 : 0.5 } }],
  });

  const S = G.structure;
  const sumCats = S.sum.bins.map((b) => S.sum.width > 1 ? `${b}–${b + S.sum.width - 1}` : String(b));
  obsVsExp("c-sum", sumCats, S.sum.obs, S.sum.exp, {});
  obsVsExp("c-odd", S.odd.k, S.odd.obs, S.odd.exp, {});
  obsVsExp("c-low", S.low.k, S.low.obs, S.low.exp, {});
  obsVsExp("c-consec", S.consec.k, S.consec.obs, S.consec.exp, {});
  obsVsExp("c-repeat", S.repeat.k, S.repeat.obs, S.repeat.exp, {});
  const drawBuckets = (size) => {
    const B = size === "5" && S.buckets5 ? S.buckets5 : S.buckets;
    obsVsExp("c-bucket", B.labels, B.obs, B.exp, {});
  };
  drawBuckets("10");
  bindSeg("bucket-seg", drawBuckets);

  const H = G.heatmap;
  const lim = isKeno ? 6 : 60;
  mk("c-heat", {
    grid: { left: 8, right: 8, top: 8, bottom: 56, containLabel: true },
    tooltip: { trigger: "item", formatter: (p) => `Số <b>${nums[p.value[1]]}</b> · ${H.periods[p.value[0]]}<br>${p.value[3]} lần (${sign(p.value[2], 1)}% so với kỳ vọng)<br>${H.draws_per_period[p.value[0]]} kỳ quay` },
    xAxis: axis({ type: "category", data: H.periods, splitLine: { show: false } }),
    yAxis: axis({ type: "category", data: nums, inverse: true, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 9, interval: isKeno ? 4 : 1 } }),
    visualMap: Object.assign(divergingMap(-lim, lim, 2), { text: [`+${lim}%`, `−${lim}%`] }),
    series: [{ type: "heatmap", data: H.cells, progressive: 0, itemStyle: { borderColor: css("--surface"), borderWidth: 1 } }],
  });

  if (G.special) {
    const Sp = G.special;
    const drawSpecial = (mode) => {
      const recent = mode === "recent" && Sp.counts_recent;
      const exp = recent ? Sp.expected_recent : Sp.expected;
      const sub = document.getElementById("c-special-sub");
      if (sub) sub.textContent = recent ? `${Sp.recent_n} kỳ gần nhất · kỳ vọng ${fmt(exp, 1)} lần/số` : `Toàn bộ · kỳ vọng ${fmt(exp, 1)} lần/số`;
      obsVsExp("c-special", Sp.numbers, recent ? Sp.counts_recent : Sp.counts, exp, {});
    };
    document.querySelector("#c-special").insertAdjacentHTML("beforebegin", `<p class="sub" id="c-special-sub"></p>`);
    drawSpecial("all");
    bindSeg("special-seg", drawSpecial);
  }
  if (G.keno_sides) {
    obsVsExp("c-big", G.keno_sides.k, G.keno_sides.big, G.keno_sides.exp, {});
    obsVsExp("c-even", G.keno_sides.k, G.keno_sides.even, G.keno_sides.exp, {});
  }

  if (G.backtest) {
    const R = G.backtest.results;
    mk("c-lift", {
      grid: { left: 8, right: 24, top: 28, bottom: 8, containLabel: true },
      tooltip: { trigger: "item", formatter: (p) => { const r = R[p.dataIndex]; return `<b>${esc(r.strategy)}</b><br>Lift ${sign(r.lift_pct)}%<br>CI 95%: [${fmt(r.lift_ci95[0], 2)}, ${fmt(r.lift_ci95[1], 2)}]<br>p = ${pval(r.p_value)} · p<sub>Holm</sub> = ${pval(r.p_holm)}`; } },
      xAxis: axis({ type: "value", axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => (v > 0 ? "+" : "") + v + "%" } }),
      yAxis: axis({ type: "category", data: R.map((r) => r.strategy), inverse: true, splitLine: { show: false } }),
      series: [
        {
          type: "custom", silent: true,
          renderItem: (params, api) => {
            const a = api.coord([api.value(0), api.value(2)]);
            const b = api.coord([api.value(1), api.value(2)]);
            return { type: "line", shape: { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, style: { stroke: css("--series-1"), lineWidth: 2, opacity: 0.55 } };
          },
          data: R.map((r, i) => [r.lift_ci95[0], r.lift_ci95[1], i]),
          encode: { x: [0, 1], y: 2 }, z: 1,
        },
        {
          type: "scatter", data: R.map((r, i) => [r.lift_pct, i]), symbolSize: 10, z: 2,
          itemStyle: { color: css("--series-1"), borderColor: css("--surface"), borderWidth: 2 },
          markLine: { silent: true, symbol: "none", lineStyle: { color: css("--ref"), type: "solid", width: 1.5 }, label: { formatter: "Ngẫu nhiên", color: css("--ink-2"), fontSize: 11, position: "start" }, data: [{ xAxis: 0 }] },
        },
      ],
    });
  }

  if (isKeno) {
    const T = G.value.rtp_table;
    mk("c-rtp", {
      tooltip: { formatter: (p) => `Bậc ${p[0].name}: hoàn trả ${pct(p[0].value)}` },
      xAxis: axis({ type: "category", data: T.map((r) => r.spot), name: "Bậc", nameLocation: "middle", nameGap: 26, splitLine: { show: false } }),
      yAxis: axis({ type: "value", min: 0, max: 0.6, axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => fmt(v * 100) + "%" } }),
      series: [{ type: "bar", data: T.map((r) => r.rtp), itemStyle: barStyle(), barCategoryGap: "25%" }],
    });
  } else {
    const E = G.value.ev_curve;
    const be = G.value.breakeven_jackpot;
    mk("c-ev", {
      grid: { left: 8, right: 24, top: 24, bottom: 8, containLabel: true },
      tooltip: { trigger: "axis", axisPointer: { type: "line", lineStyle: { color: css("--axis") } }, formatter: (p) => `Jackpot ${vnd(p[0].value[0])}<br>Hoàn trả ${pct(p[0].value[1])}` },
      xAxis: axis({ type: "value", name: "Jackpot", nameLocation: "middle", nameGap: 26, axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => fmt(v / 1e9) + " tỷ" } }),
      yAxis: axis({ type: "value", axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => fmt(v * 100) + "%" } }),
      series: [{
        type: "line", showSymbol: false, data: E.jackpot.map((j, i) => [j, E.rtp[i]]),
        lineStyle: { color: css("--series-1"), width: 2 }, itemStyle: { color: css("--series-1") },
        markLine: { silent: true, symbol: "none", lineStyle: { color: css("--ref"), type: "solid", width: 1.5 },
          label: { color: css("--ink-2"), fontSize: 11 },
          data: [{ yAxis: 1, label: { formatter: "Hòa vốn (100%)", position: "insideStartTop" } }, ...(be && be <= E.jackpot[E.jackpot.length - 1] ? [{ xAxis: be, label: { formatter: vnd(be), position: "insideEndTop" } }] : [])] },
      }],
    });
  }
}

/* "Kết quả gần nhất" for lotto: each draw vs the pool suggested before it */
function recentVsPoolHtml(key, G) {
  const m = getModel(key), P = G.pool, F = P.final, N = m.pool, d0 = m.pick;
  const hist = poolHistory(m, P), byT = new Map(hist.map((r) => [r.t, r]));
  const idxById = new Map(m.draws.map((d, i) => [d.id, i]));
  const test = hist.filter((r) => r.source !== "train"), logged = hist.filter((r) => r.source === "log");
  const n = test.length, sumHits = test.reduce((a, r) => a + r.hits, 0);
  const meanK = test.reduce((a, r) => a + r.K, 0) / n;
  const allRanks = test.flatMap((r) => r.ranks);
  const meanRank = allRanks.reduce((a, b) => a + b, 0) / allRanks.length;
  const logE = logged.reduce((a, r) => a + r.K * d0 / N, 0), logH = logged.reduce((a, r) => a + r.hits, 0);
  const tag = (src) => `<span class="tag" title="${esc(POOL_SOURCE[src][1])}">${POOL_SOURCE[src][0]}</span>`;
  const ranksHtml = (r) => r.ranks.slice().sort((a, b) => a - b).map((x) => x <= r.K ? `<b>${x}</b>` : `<span class="muted">${x}</span>`).join(" · ");
  const rows = G.recent_draws.slice(0, 20).map((d) => {
    const r = byT.get(idxById.get(d.id));
    if (!r) return `<tr><td>${d.date}</td><td>#${d.id}</td><td>${ballsHtml(d.main, d.special, { ctx: d })}</td><td colspan="3" class="muted">Chưa đủ dữ liệu để tạo pool</td></tr>`;
    const inPool = new Set(r.pool);
    return `<tr><td>${d.date}</td><td>#${d.id}</td><td>${ballsHtml(d.main, d.special, { ctx: d, hits: inPool })}</td>
      <td class="num"><b>${r.hits}</b>/${d0} <span class="muted">(kỳ vọng ${fmt(r.K * d0 / N, 2)})</span></td>
      <td style="font-variant-numeric:tabular-nums;white-space:nowrap">${ranksHtml(r)}</td>
      <td>${ballsHtml(r.pool, null, { hits: new Set(d.main), click: false })}<div class="muted" style="font-size:12px;margin-top:2px">${r.K} số · ${tag(r.source)}</div></td></tr>`;
  }).join("");
  return `
  <p class="lede">Mỗi kỳ so với pool gợi ý <i>trước</i> kỳ đó. Ở cột Bộ số, số tô xanh là số trúng nằm trong pool; ở cột Pool, số tô xanh là số đã trúng.
  "Hạng điểm": thứ hạng của từng số trúng trong bảng điểm của pool (1 = điểm cao nhất, in đậm = nằm trong pool). Bấm vào một bộ số để xem phân tích chi tiết.</p>
  <div class="card scroll"><table><thead><tr><th>Ngày</th><th>Kỳ</th><th>Bộ số</th><th class="num">Trong pool</th><th>Hạng điểm các số trúng</th><th>Pool trước kỳ</th></tr></thead><tbody>
  <tr><td>Kỳ tới</td><td class="muted">—</td><td class="muted">Chưa quay</td><td></td><td></td><td>${ballsHtml(F.pool, null, { click: false })}<div class="muted" style="font-size:12px;margin-top:2px">${F.k} số · <a href="#suggest/${key}">pool hiện tại</a></div></td></tr>
  ${rows}
  </tbody></table></div>

  <h3 style="margin-top:20px">Số trúng so với pool — tổng hợp</h3>
  <p class="lede">Tính trên ${fmt(n)} kỳ không dùng khi dò trọng số (từ ${P.split_date}${logged.length ? `, gồm ${fmt(logged.length)} kỳ có pool đã công bố` : ""}). Nếu cách chấm điểm có tác dụng, số trúng phải dồn về các hạng đầu; nếu không, chúng rải đều mọi hạng.</p>
  <div class="grid tiles">
    ${tile("Số trúng trong pool / kỳ", fmt(sumHits / n, 3), `Pool ngẫu nhiên ${fmt(meanK, 0)} số: ${fmt(meanK * d0 / N, 3)}`)}
    ${tile("Tỉ lệ số trúng rơi vào pool", pct(sumHits / (n * d0)), `Ngẫu nhiên: ${pct(meanK / N)} (= K ÷ ${N})`)}
    ${tile("Hạng điểm TB của số trúng", fmt(meanRank, 1), `Ngẫu nhiên: ${fmt((N + 1) / 2, 1)} · thấp hơn = tốt hơn`)}
    ${tile("Pool đã công bố", logged.length ? `${fmt(logH)} / ${fmt(logged.length * d0)}` : "Chưa có", logged.length ? `số trúng trong pool · kỳ vọng ${fmt(logE, 1)}` : "Bắt đầu ghi nhật ký từ lần cập nhật tới")}
  </div>
  <div class="grid" style="margin-top:16px">
    <div class="card wide"><h3>Số trúng theo hạng điểm</h3><p class="sub">Mỗi cột: số lần một số trúng có hạng điểm đó. Xanh: các hạng nằm trong pool (K = ${P.chosen.k}). Đường xám: kỳ vọng nếu điểm không liên quan đến kết quả.</p>
      ${legendInline("Số trúng", "Kỳ vọng nếu ngẫu nhiên")}<div id="c-rank" class="chart"></div></div>
  </div>`;
}
function drawRankChart(key, G) {
  const m = getModel(key), P = G.pool, N = m.pool, K = P.chosen.k;
  const test = poolHistory(m, P).filter((r) => r.source !== "train");
  const cnt = new Array(N).fill(0);
  test.forEach((r) => r.ranks.forEach((x) => cnt[x - 1]++));
  const exp = test.length * m.pick / N;
  mk("c-rank", {
    grid: { left: 8, right: 16, top: 24, bottom: 30, containLabel: true },
    xAxis: axis({ type: "category", data: range1(N), name: "Hạng điểm (1 = cao nhất)", nameLocation: "middle", nameGap: 26, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 11, interval: 4 } }),
    yAxis: axis({ type: "value" }),
    tooltip: { formatter: (p) => `Hạng ${p[0].name}${p[0].dataIndex < K ? " (trong pool)" : ""}<br>${p[0].value} lần · kỳ vọng ${fmt(exp, 1)}` },
    series: [{
      type: "bar", barCategoryGap: "15%",
      data: cnt.map((c, i) => ({ value: c, itemStyle: { color: css(i < K ? "--series-1" : "--ref"), opacity: i < K ? 1 : 0.45, borderRadius: [3, 3, 0, 0] } })),
      markLine: refLine(exp, "Kỳ vọng " + fmt(exp, 1)),
    }],
  });
}

/* pool.js — mirrors src/models/pool_optimizer.py for the browser.
   Row t of the feature matrix uses only draws < t (row T = next draw); each
   feature is standardised across numbers. score = features · weights,
   pool = K highest scores (ties -> smaller number). */
const POOL_FEATURES = {
  freq_all: ["Tần suất toàn bộ", "Số lần về từ trước đến nay"],
  freq_10: ["Tần suất 10 kỳ", "Số lần về trong 10 kỳ gần nhất"],
  freq_30: ["Tần suất 30 kỳ", "Số lần về trong 30 kỳ gần nhất"],
  freq_100: ["Tần suất 100 kỳ", "Số lần về trong 100 kỳ gần nhất"],
  absence: ["Số kỳ đang vắng", "Bao nhiêu kỳ liên tiếp chưa về"],
  last: ["Về ở kỳ trước", "Có nằm trong kết quả kỳ ngay trước không"],
  pair: ["Đi cặp với kỳ trước", "Số lần từng về cùng các số của kỳ trước"],
  markov1: ["Markov bậc 1", "Số lần từng về ngay 1 kỳ sau các số của kỳ trước"],
  markov2: ["Markov bậc 2", "Số lần từng về 2 kỳ sau các số của kỳ cách đây 2 kỳ"],
};
const POOL_WINDOWS = [10, 30, 100];

/* Float64Array, index (t * N + i) * F + f */
function poolFeatures(m) {
  if (m.poolX) return m.poolX;
  const N = m.pool, T = m.draws.length, F = 1 + POOL_WINDOWS.length + 5;
  const X = new Float64Array((T + 1) * N * F);
  const cum = [new Float64Array(N)];
  const absence = new Float64Array(N), pair = new Float64Array(N), last = new Float64Array(N);
  const co = new Float64Array(N * N);
  // tr[lag][j * N + i]: times i was drawn `lag` draws after j
  const tr = { 1: new Float64Array(N * N), 2: new Float64Array(N * N) };
  const mk = { 1: new Float64Array(N), 2: new Float64Array(N) };
  const raw = Array.from({ length: F }, () => new Float64Array(N));
  for (let t = 0; t <= T; t++) {
    if (t > 0) {
      const prev = m.draws[t - 1].main;
      const c = Float64Array.from(cum[t - 1]);
      prev.forEach((v) => c[v - 1]++);
      cum.push(c);
      const inPrev = new Uint8Array(N);
      prev.forEach((v) => (inPrev[v - 1] = 1));
      for (let i = 0; i < N; i++) {
        absence[i] = inPrev[i] ? 0 : absence[i] + 1;
        last[i] = inPrev[i];
        let s = 0;
        for (const v of prev) s += co[i * N + v - 1];
        pair[i] = s;
      }
      for (const a of prev) for (const b of prev) if (a !== b) co[(a - 1) * N + b - 1]++;
      for (const lag of [1, 2]) {
        if (t - 1 - lag >= 0) for (const a of m.draws[t - 1 - lag].main) for (const b of prev) tr[lag][(a - 1) * N + b - 1]++;
        if (t - lag >= 0) {
          const src = m.draws[t - lag].main;
          for (let i = 0; i < N; i++) { let s = 0; for (const a of src) s += tr[lag][(a - 1) * N + i]; mk[lag][i] = s; }
        }
      }
    }
    raw[0] = cum[t];
    POOL_WINDOWS.forEach((w, j) => {
      const from = cum[Math.max(t - w, 0)];
      for (let i = 0; i < N; i++) raw[1 + j][i] = cum[t][i] - from[i];
    });
    raw[F - 5] = absence; raw[F - 4] = last; raw[F - 3] = pair; raw[F - 2] = mk[1]; raw[F - 1] = mk[2];
    for (let f = 0; f < F; f++) {
      const r = raw[f];
      let mu = 0;
      for (let i = 0; i < N; i++) mu += r[i];
      mu /= N;
      let v = 0;
      for (let i = 0; i < N; i++) v += (r[i] - mu) ** 2;
      const sd = Math.sqrt(v / N);
      for (let i = 0; i < N; i++) X[(t * N + i) * F + f] = sd > 0 ? (r[i] - mu) / sd : 0;
    }
  }
  m.poolX = X;
  m.poolF = F;
  return X;
}

function poolScores(m, t, w) {
  const X = poolFeatures(m), N = m.pool, F = m.poolF;
  return Array.from({ length: N }, (_, i) => {
    let s = 0;
    for (let f = 0; f < F; f++) s += X[(t * N + i) * F + f] * w[f];
    return s;
  });
}
/* 1-based numbers of the K-number pool for draw t (sorted ascending) */
function poolAt(m, t, w, K) {
  const s = poolScores(m, t, w);
  return s.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).slice(0, K).map((x) => x[1] + 1).sort((a, b) => a - b);
}
/* walk-forward: pool for each draw t in [start, T) and its hits */
function poolBacktest(m, w, K, start) {
  const out = [];
  for (let t = start; t < m.draws.length; t++) {
    const pool = poolAt(m, t, w, K), set = new Set(m.draws[t].main);
    out.push({ t, pool, hits: pool.reduce((a, v) => a + (set.has(v) ? 1 : 0), 0) });
  }
  return out;
}
const poolExpected = (m, K) => K * m.pick / m.pool;
/* lift of mean hits vs a random pool of K; normal-approx CI and p */
function poolLift(hits, e) {
  const n = hits.length, mean = hits.reduce((a, b) => a + b, 0) / n;
  const sd = Math.sqrt(hits.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1));
  const se = sd / Math.sqrt(n), L = (v) => (v / e - 1) * 100;
  return { mean, lift: L(mean), lo: L(mean - 1.96 * se), hi: L(mean + 1.96 * se), p: se > 0 ? 2 * normSf(Math.abs(mean - e) / se) : 1, n };
}
function poolVerdict(lo, hi) {
  if (lo > 0) return `<span class="verdict bad">Hơn ngẫu nhiên có ý nghĩa ở mức 95%</span> — hãy thử lại trên giai đoạn khác trước khi tin: thử nhiều cấu hình thì khoảng 1/20 sẽ "có ý nghĩa" do may rủi.`;
  if (hi < 0) return `<span class="verdict bad">Kém hơn ngẫu nhiên có ý nghĩa ở mức 95%</span> — dấu hiệu quá khớp (overfitting) hoặc may rủi.`;
  return `<span class="verdict ok">Không khác ngẫu nhiên</span> — khoảng tin cậy 95% của lift chứa 0.`;
}

/* cumulative (hits − expected) with an optional split marker */
function excessChart(id, dates, hits, e, splitIdx = null) {

/* Pool in force before each draw t >= warmup: the published one from the
   pool log when available, else reconstructed with the train-only weights
   (P.chosen). ranks = score rank (1 = best) of each winning number. */
function poolHistory(m, P) {
  if (m.poolHist) return m.poolHist;
  const logged = new Map((P.log || []).map((r) => [r.after_id, r]));
  const split = P.warmup + P.split_index;
  const rows = [];
  for (let t = P.warmup; t < m.draws.length; t++) {
    const L = logged.get(m.draws[t - 1].id);
    const w = L ? L.weights : P.chosen.weights, K = L ? L.k : P.chosen.k;
    const s = poolScores(m, t, w);
    const order = s.map((v, i) => [v, i + 1]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map((x) => x[1]);
    const rank = new Map(order.map((v, i) => [v, i + 1]));
    const pool = L ? L.pool : order.slice(0, K).sort((a, b) => a - b);
    const inPool = new Set(pool), main = m.draws[t].main;
    rows.push({
      t, K, pool, source: L ? "log" : t < split ? "train" : "test",
      hits: main.filter((v) => inPool.has(v)).length, ranks: main.map((v) => rank.get(v)),
    });
  }
  m.poolHist = rows;
  return rows;
}

    xAxis: axis({ type: "category", data: rows.map((r) => r.k), name: "K (số trong pool)", nameLocation: "middle", nameGap: 26, splitLine: { show: false } }),
    yAxis: axis({ type: "value", axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => sign(v, 0) + "%" } }),
    tooltip: { formatter: (p) => { const r = rows[p[0].dataIndex]; return `K = ${r.k}<br>Lift ${sign(r.lift_pct, 1)}% · CI ${sign(r.ci95[0], 1)} … ${sign(r.ci95[1], 1)}<br>p = ${pval(r.p_value)} · ${fmt(r.n)} kỳ`; } },
    series: [
      {
        type: "custom", data: rows.map((r, i) => [i, r.ci95[0], r.ci95[1]]),
        renderItem: (params, api) => {
          const lo = api.coord([api.value(0), api.value(1)]), hi = api.coord([api.value(0), api.value(2)]);
          const w = api.size([1, 0])[0] * 0.25, style = { stroke: ink, lineWidth: 1.5 };
          return { type: "group", children: [
            { type: "line", shape: { x1: lo[0], y1: lo[1], x2: hi[0], y2: hi[1] }, style },
            { type: "line", shape: { x1: lo[0] - w, y1: lo[1], x2: lo[0] + w, y2: lo[1] }, style },
            { type: "line", shape: { x1: hi[0] - w, y1: hi[1], x2: hi[0] + w, y2: hi[1] }, style },
          ] };
        },
        encode: { x: 0, y: [1, 2] }, z: 1,
      },
      {
        type: "scatter", data: rows.map((r) => r.lift_pct), symbolSize: 9, z: 2,
        itemStyle: { color: ink, borderColor: css("--surface"), borderWidth: 2 },
        markLine: { silent: true, symbol: "none", lineStyle: { color: css("--ref"), width: 1.5 }, label: { formatter: "Ngẫu nhiên", color: css("--ink-2"), fontSize: 11, position: "insideEndTop" }, data: [{ yAxis: 0 }] },
      },
    ],
  });
}

/* search.js — "Tra cứu": find past draws containing / overlapping a set. */
const SEARCH_LIMIT = 200;

function parseNumbers(text, pool) {
  const raw = (text.match(/\d+/g) || []).map(Number);
  const bad = raw.filter((v) => v < 1 || v > pool);
  const nums = [...new Set(raw.filter((v) => v >= 1 && v <= pool))].sort((a, b) => a - b);
  return { nums, bad, dup: raw.length - bad.length - nums.length };
}

function renderSearch(key) {
  if (!LOTTO.includes(key)) {
    document.getElementById("app").innerHTML = `<h2>Tra cứu</h2><p class="lede">Tra cứu chỉ hỗ trợ Power 6/55, Mega 6/45 và Lotto 5/35.</p>`;
    return;
  }
  const m = getModel(key);
  const last = store(`vl-q-${key}`) || "";
  document.getElementById("app").innerHTML = `
  <h2>Tra cứu bộ số trong lịch sử</h2>
  <p class="lede">Nhập 1–${m.pick} số (cách nhau bởi dấu cách hoặc dấu phẩy) để tìm các kỳ ${m.name} đã có những số đó. Bấm vào một kỳ để xem phân tích.</p>
  <div class="card">
    <form class="controls" id="q-form" style="margin:0">
      <input type="text" id="q" inputmode="numeric" autocomplete="off" placeholder="VD: 5 12 23 34 41 50" value="${esc(last)}" aria-label="Các số cần tìm">
      <label>Điều kiện <select id="q-mode">
        <option value="all">Chứa tất cả các số</option>
        ${range1(m.pick - 1).reverse().map((k) => `<option value="${k}">Trùng ít nhất ${k} số</option>`).join("")}
      </select></label>
      <button class="primary" type="submit">Tìm</button>
      <button class="ghost" type="button" id="q-analyse" disabled>Phân tích bộ này</button>
    </form>
    <p class="sub" id="q-msg" style="margin-top:8px"></p>
  </div>
  <div id="q-out"></div>`;
  const run = () => {
    const { nums, bad } = parseNumbers(document.getElementById("q").value, m.pool);
    store(`vl-q-${key}`, document.getElementById("q").value);
    const msg = document.getElementById("q-msg");
    const btn = document.getElementById("q-analyse");
    btn.disabled = nums.length !== m.pick;
    btn.onclick = () => openTicket(key, nums);
    if (!nums.length) { msg.innerHTML = bad.length ? `<span class="err">Số ngoài khoảng 1–${m.pool}: ${bad.join(", ")}</span>` : ""; document.getElementById("q-out").innerHTML = ""; return; }
    if (nums.length > m.pick) { msg.innerHTML = `<span class="err">Tối đa ${m.pick} số.</span>`; return; }
    msg.innerHTML = `Đang tìm: ${ballsHtml(nums, null, { click: false })}${bad.length ? ` <span class="err">(bỏ qua ${bad.join(", ")})</span>` : ""}`;
    renderSearchResults(m, nums, document.getElementById("q-mode").value);
  };
  document.getElementById("q-form").addEventListener("submit", (e) => { e.preventDefault(); run(); });
  document.getElementById("q-mode").addEventListener("change", run);
  if (last) run();
}

function renderSearchResults(m, nums, mode) {
  const k = nums.length, nD = m.draws.length;
  const need = mode === "all" ? k : Math.min(Number(mode), k);
  const by = new Array(k + 1).fill(0);
  const hits = [];
  for (let i = nD - 1; i >= 0; i--) {
    const o = overlapCount(m.draws[i].main, nums);
    by[o]++;
    if (o >= need) hits.push([i, o]);
  }
  const set = new Set(nums);
  const exp = (j) => nD * hypergeom(m.pool, m.pick, k, j);
  const exact = k === m.pick ? hits.filter(([, o]) => o === k).length : null;
  document.getElementById("q-out").innerHTML = `
  <div class="grid tiles" style="margin-top:16px">
    ${tile("Số kỳ khớp điều kiện", fmt(hits.length), `Kỳ vọng nếu ngẫu nhiên ≈ ${fmt(range1(k).filter((j) => j >= need).reduce((a, j) => a + exp(j), 0), 2)}`)}
    ${exact !== null ? tile("Trùng hoàn toàn", exact ? `<span class="verdict bad">${exact} lần</span>` : `<span class="verdict ok">Chưa từng</span>`, "Bộ này đã từng là kết quả?") : ""}
    ${tile("Lần gần nhất", hits.length ? m.draws[hits[0][0]].date : "–", hits.length ? `Kỳ #${m.draws[hits[0][0]].id}` : "")}
  </div>
  <div class="card scroll" style="margin-top:16px"><h3>Phân bố số trùng với ${fmt(nD)} kỳ</h3>
    <table><thead><tr><th>Trùng</th>${range1(k + 1).map((j) => `<th class="num">${j - 1} số</th>`).join("")}</tr></thead><tbody>
    <tr><td>Quan sát</td>${by.map((c) => `<td class="num">${fmt(c)}</td>`).join("")}</tr>
    <tr><td class="muted">Kỳ vọng</td>${by.map((_, j) => `<td class="num muted">${fmt(exp(j), 1)}</td>`).join("")}</tr></tbody></table></div>
  <div class="card scroll" style="margin-top:16px"><h3>Các kỳ khớp${hits.length > SEARCH_LIMIT ? ` (${SEARCH_LIMIT} kỳ gần nhất)` : ""}</h3>
    ${hits.length ? `<table><thead><tr><th>Ngày</th><th>Kỳ</th><th>Bộ số (tô đậm = trùng)</th><th class="num">Trùng</th></tr></thead><tbody>
    ${hits.slice(0, SEARCH_LIMIT).map(([i, o]) => { const d = m.draws[i]; return `<tr><td>${d.date}</td><td>#${d.id}</td><td>${ballsHtml(d.main, d.special, { hits: set, ctx: d })}</td><td class="num">${o}</td></tr>`; }).join("")}
    </tbody></table>` : `<p class="muted">Không có kỳ nào.</p>`}</div>`;
}

/* backtest.js — interactive pool backtest: pick K and feature weights, see
   how many winning numbers the pool would have caught, draw by draw
   (walk-forward, see pool.js), versus a random pool of the same size. */
const BT_PRESETS = {
  chosen: "Tối ưu (đã kiểm tra)",
  final: "Pool kỳ tới",
  hot: "Nóng 30 kỳ",
  cold: "Lạnh 30 kỳ",
  absent: "Vắng lâu",
  repeat: "Lặp kỳ trước",
};

function presetWeights(P, name) {
  const w = P.features.map(() => 0), at = (k) => P.features.indexOf(k);
  if (name === "chosen") return { w: P.chosen.weights.slice(), k: P.chosen.k };
  if (name === "final") return { w: P.final.weights.slice(), k: P.final.k };
  if (name === "hot") w[at("freq_30")] = 1;
  if (name === "cold") w[at("freq_30")] = -1;
  if (name === "absent") w[at("absence")] = 1;
  if (name === "repeat") w[at("last")] = 1;
  return { w, k: null };
}

function renderBacktest(key) {
  if (!LOTTO.includes(key)) {
    document.getElementById("app").innerHTML = `<h2>Backtest</h2><p class="lede">Backtest pool chỉ hỗ trợ Power 6/55, Mega 6/45 và Lotto 5/35. Kết quả backtest Keno có ở mục Phân tích.</p>`;
    return;
  }
  const G = DATA.games[key], P = G.pool, m = getModel(key);
  const nD = m.draws.length, maxEval = nD - P.warmup;
  document.getElementById("app").innerHTML = `
  <h2>Backtest pool</h2>
  <p class="lede">Tự chọn kích thước pool và trọng số từng yếu tố, rồi xem pool đó lẽ ra đã chứa bao nhiêu số trúng ở mỗi kỳ. Mỗi kỳ chỉ dùng dữ liệu <i>trước</i> kỳ đó; so với pool chọn ngẫu nhiên cùng kích thước. Kết quả cập nhật ngay khi thay đổi.</p>
  <div class="card">
    <div class="controls" style="margin:0 0 8px">
      <label>Kích thước pool <select id="bt-k">${range1(m.pool - m.pick - 1).map((i) => i + m.pick).map((k) => `<option value="${k}">${k} số</option>`).join("")}</select></label>
      <label>Giai đoạn <select id="bt-p">
        <option value="100">100 kỳ gần nhất</option><option value="300">300 kỳ gần nhất</option>
        <option value="test" selected>Giai đoạn kiểm tra (từ ${P.split_date})</option><option value="all">Toàn bộ (${fmt(maxEval)} kỳ)</option></select></label>
    </div>
    <div class="controls" style="margin:0 0 10px">${Object.entries(BT_PRESETS).map(([k, l]) => `<button class="ghost" type="button" data-preset="${k}">${l}</button>`).join("")}</div>
    <div class="wgrid">${P.features.map((f, j) => `<label title="${esc(POOL_FEATURES[f][1])}"><span>${POOL_FEATURES[f][0]}</span>
      <input type="range" min="-1" max="1" step="0.05" value="0" data-f="${j}"><output data-o="${j}">0</output></label>`).join("")}</div>
    <p class="sub" id="bt-msg" style="margin-top:8px"></p>
  </div>
  <div id="bt-out"></div>`;

  const kSel = document.getElementById("bt-k"), pSel = document.getElementById("bt-p");
  const sliders = [...document.querySelectorAll(".wgrid input")];
  // presets keep their exact weights; sliders (step 0.05) only show them
  let exact = null;
  const setWeights = (w) => { exact = w.slice(); sliders.forEach((s, j) => { s.value = String(w[j]); }); };
  const read = () => exact || sliders.map((s) => Number(s.value));
  let preset = "chosen";
  const run = () => {
    const w = read();
    sliders.forEach((s, j) => (document.querySelector(`[data-o="${j}"]`).textContent = sign(w[j])));
    const K = Number(kSel.value), p = pSel.value;
    const start = p === "all" ? P.warmup : p === "test" ? P.warmup + P.split_index : nD - Number(p);
    const t0 = performance.now();
    const res = poolBacktest(m, w, K, start);
    const zero = w.every((v) => v === 0);
    document.getElementById("bt-msg").innerHTML = `${fmt(res.length)} kỳ (${m.draws[start].date} → ${m.draws[nD - 1].date}) · ${fmt(performance.now() - t0, 0)} ms${zero ? ' · <span class="err">Mọi trọng số bằng 0: pool luôn là các số nhỏ nhất.</span>' : ""}${preset === "final" ? ' · <span class="err">Trọng số này đã được dò trên chính các kỳ đang chấm, nên kết quả bị thổi phồng (quá khớp).</span>' : ""}`;
    renderBacktestResults(m, K, res);
  };
  let timer = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(run, 120); };
  sliders.forEach((s) => s.addEventListener("input", () => { preset = null; exact = null; later(); }));
  kSel.addEventListener("change", run);
  pSel.addEventListener("change", run);
  document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
    const { w, k } = presetWeights(P, b.dataset.preset);
    preset = b.dataset.preset;
    setWeights(w);
    if (k) kSel.value = String(k);
    run();
  }));
  const { w, k } = presetWeights(P, "chosen");
  setWeights(w);
  kSel.value = String(k);
  run();
}

function renderBacktestResults(m, K, res) {
  const e = poolExpected(m, K), hits = res.map((r) => r.hits), L = poolLift(hits, e);
  const dist = new Array(m.pick + 1).fill(0);
  hits.forEach((h) => dist[h]++);
  const expDist = range1(m.pick + 1).map((x) => x - 1).map((h) => res.length * comb(m.pick, h) * comb(m.pool - m.pick, K - h) / comb(m.pool, K));
  const full = hits.filter((h) => h === m.pick).length;
  const recent = res.slice(-12).reverse();
  document.getElementById("bt-out").innerHTML = `
  <div class="grid tiles" style="margin-top:16px">
    ${tile("Số trúng TB / kỳ", fmt(L.mean, 3), `Pool ngẫu nhiên ${K} số: ${fmt(e, 3)}`)}
    ${tile("Lift", `${sign(L.lift, 1)}%`, `CI 95%: ${sign(L.lo, 1)} … ${sign(L.hi, 1)} · p = ${pval(L.p)}`)}
    ${tile(`Kỳ pool chứa đủ ${m.pick} số`, fmt(full), `Kỳ vọng ngẫu nhiên: ${fmt(expDist[m.pick], 1)}`)}
    ${tile("Chi phí bao / kỳ", vnd(comb(K, m.pick) * 10000), `${fmt(comb(K, m.pick))} vé ${m.pick} số`)}
  </div>
  <p style="margin:12px 0 0">${poolVerdict(L.lo, L.hi)}</p>
  <div class="grid" style="margin-top:16px">
    <div class="card wide"><h3>Số trúng dư so với ngẫu nhiên, cộng dồn</h3><p class="sub">Đi lên = pool chứa nhiều số trúng hơn pool ngẫu nhiên. Dao động lên xuống quanh 0 là bình thường với dữ liệu ngẫu nhiên.</p>
      <div id="bt-cum" class="chart"></div></div>
    <div class="card"><h3>Số trúng mỗi kỳ</h3><p class="sub">So với phân phối siêu bội.</p>${legendInline("Pool", "Kỳ vọng nếu ngẫu nhiên")}<div id="bt-dist" class="chart"></div></div>
    <div class="card scroll"><h3>12 kỳ gần nhất</h3><p class="sub">Pool tại thời điểm trước kỳ quay; số tô xanh là số trúng.</p>
      <table><tbody>${recent.map((r) => `<tr><td class="muted">${m.draws[r.t].date}</td><td>${ballsHtml(r.pool, null, { hits: new Set(m.draws[r.t].main), click: false })}</td><td class="num">${r.hits}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
  excessChart("bt-cum", res.map((r) => m.draws[r.t].date), hits, e);
  obsVsExp("bt-dist", range1(m.pick + 1).map((x) => x - 1), dist, expDist, { xName: "Số trúng trong pool", obsName: "Pool" });
}

  ${t("kiem-dinh", "Kiểm định tính ngẫu nhiên", dl([
    ["Tần suất số (chi-square)", "So số lần xuất hiện của từng số với kỳ vọng. Thống kê đã hiệu chỉnh vì các số trong cùng kỳ không lặp lại."],

  ${t("pool-pp", "Pool số: cách chọn và kiểm chứng", `<p>Mục <b>Pool số</b> gợi ý một nhóm K số (thay cho từng vé). Pool giống nhau với mọi người xem.</p><ol>
    <li><b>Chấm điểm.</b> Trước mỗi kỳ, mỗi số có ${Object.keys(POOL_FEATURES).length} yếu tố tính từ các kỳ đã quay: ${Object.values(POOL_FEATURES).map((x) => x[0].toLowerCase()).join(", ")}. Mỗi yếu tố được chuẩn hóa giữa các số (0 = trung bình, ±1 = một độ lệch chuẩn). <i>Markov bậc 1</i>: đếm trong lịch sử số lần số này về ngay sau các số vừa ra ở kỳ trước (chuỗi Markov 1 bước, gồm cả việc tự lặp lại). <i>Markov bậc 2</i>: tương tự với bước nhảy 2 kỳ, từ các số của kỳ cách đây 2 kỳ. Hai bước được cộng có trọng số thay vì dùng trạng thái chung của 2 kỳ liền nhau, vì trạng thái chung có quá nhiều tổ hợp so với ~1.000–1.300 kỳ dữ liệu.</li>
    <li><b>Điểm</b> = tổng (yếu tố × trọng số). Trọng số dương ưu tiên số có giá trị cao, âm ưu tiên giá trị thấp. Nhờ vậy cùng một công thức bao gồm cả số nóng, số lạnh, số vắng lâu, tránh/ưu tiên số vừa về, theo cặp. Pool = K số điểm cao nhất (bằng điểm thì lấy số nhỏ hơn).</li>
    <li><b>Dò và chọn K.</b> Thử ${fmt(DATA.games.power655.pool.n_weights)} bộ trọng số (${2 * Object.keys(POOL_FEATURES).length} bộ chỉ dùng một yếu tố, dấu + hoặc −, và các hướng ngẫu nhiên) cho mọi K trong lưới (6/55, 6/45: 7–18 số; 5/35: 6–15 số). Quy tắc chọn lồng nhau: trong một đoạn dữ liệu huấn luyện, với mỗi K dò trọng số trên 70% đầu; chọn K có z tốt nhất trên 30% còn lại (dữ liệu chưa dùng để dò trọng số); rồi dò lại trọng số cho K đó trên cả đoạn. Như vậy K không được chọn trên chính dữ liệu đã dùng để dò trọng số.</li>
    <li><b>Kiểm định chéo nhiều lớp (chọn K).</b> Chia 60% số kỳ gần nhất thành 6 khối liên tiếp; mỗi khối áp dụng quy tắc trên với dữ liệu trước khối rồi chấm trên khối (walk-forward lồng nhau). Báo cáo K được chọn ở từng khối, lift ngoài mẫu gộp, và lift ngoài mẫu của từng K. Một K tối ưu thật phải được chọn ổn định và thắng ngẫu nhiên ở các khối.</li>
    <li><b>Kiểm tra.</b> Chấm cấu hình đó trên 30% số kỳ còn lại — chưa dùng khi dò. Lift = số trúng trung bình ÷ kỳ vọng của pool ngẫu nhiên cùng K (K × số bóng quay ÷ tổng số) − 1; t-test và khoảng tin cậy 95%.</li>
    <li><b>Pool kỳ tới.</b> Áp dụng cùng quy tắc chọn K và trọng số trên toàn bộ dữ liệu rồi chấm điểm cho kỳ tới. Vì trọng số này đã "thấy" cả giai đoạn kiểm tra, backtest nó trên quá khứ sẽ đẹp hơn thực tế — con số đáng tin là kết quả ở bước Kiểm tra.</li>
  <li><b>Đối chiếu kết quả.</b> Mỗi lần cập nhật tự động, pool vừa công bố được lưu vào nhật ký (<code>data/pool_log.jsonl</code> trong repo, kèm K và trọng số). Bảng "Kết quả gần nhất" ở mục Phân tích so mỗi kỳ với pool đã công bố trước kỳ đó; với các kỳ trước khi có nhật ký, pool được tái dựng bằng trọng số chỉ dò trên giai đoạn trước kiểm tra. "Hạng điểm" của một số trúng là thứ hạng của nó trong bảng điểm (1 = cao nhất): nếu cách chấm điểm có tác dụng, số trúng phải dồn về các hạng đầu.</li>
  </ol><p>Lift ở giai đoạn dò luôn dương vì đã chọn cấu hình tốt nhất trong hàng nghìn lựa chọn trên chính dữ liệu đó (quá khớp). Chỉ kết quả kiểm tra phản ánh khả năng thật. Số trúng chỉ tính số chính (không tính số đặc biệt 6/55 và số 1–12 của 5/35).</p>
  <p><b>Backtest Python</b> (mục Phân tích) còn so các chiến lược chọn vé: Random, Hot, Cold, Not repeat, Exponential decay, Long absence, Markov chain, Pair frequency, Pattern (gaps), Unseen pool.</p>`)}

  ${t("bo-loc", "Bộ lọc tiêu chuẩn", `<ul>
    <li>Luôn loại các bộ đã từng là kết quả.</li>

  </ul><p>Bộ lọc dùng trong backtest Python (Unseen pool) và mục đánh giá vé ở popup phân tích bộ số. Nó làm vé trông giống một kỳ quay điển hình. Nó <b>không</b> làm tăng xác suất trúng: mỗi bộ số cụ thể vẫn có xác suất như nhau.</p>`)}

  ${t("backtest-pp", "Phương pháp backtest", `<ul>

    <li>Backtest Python (mục Phân tích): chiến lược và Ngẫu nhiên chạy trên cùng các kỳ, cùng số vé; kiểm định trên trung bình mỗi kỳ vì các vé trong cùng kỳ không độc lập; giải thưởng theo bảng chính thức, Jackpot ở mức tối thiểu, giá vé 10.000đ.</li>

  ${t("gioi-han", "Giới hạn", `<ul>

/* app.js — router (#view/game), product tabs, theme. Loaded last. */
const VIEWS = [
  ["analysis", "Phân tích", renderAnalysis],
  ["suggest", "Pool số", renderSuggest],
  ["search", "Tra cứu", renderSearch],
  ["backtest", "Backtest", renderBacktest],
  ["info", "Phương pháp", renderInfo],
];
const state = { view: "analysis", game: "power655" };

function parseHash() {
  const [v, g] = location.hash.replace(/^#/, "").split("/");
  if (VIEWS.some(([k]) => k === v)) state.view = v;
  if (g && DATA.games[g]) state.game = g;
}
function navigate(view = state.view, game = state.game) {
  const h = view === "info" ? "#info" : `#${view}/${game}`;
  if (location.hash !== h) history.replaceState(null, "", h);
  state.view = view; state.game = game;
  store("vl-tab", game);
  render();
}
function render() {
  const dlg = document.getElementById("ticket-dlg");
  if (dlg.open) dlg.close();
  disposeAll();
  document.querySelectorAll(".view-btn").forEach((b) => {
    if (b.dataset.v === state.view) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.k === state.game)));
  document.getElementById("game-bar").style.display = state.view === "info" ? "none" : "";
  const [, , fn] = VIEWS.find(([k]) => k === state.view);
  try {
    fn(state.game);
  } catch (e) {
    console.error(e);
    document.getElementById("app").innerHTML = `<p class="err">Lỗi hiển thị: ${esc(e.message)}</p>`;
  }
  document.getElementById("app").insertAdjacentHTML("beforeend", `<footer>Dữ liệu: vietlott-data · cập nhật ${DATA.generated} · Chỉ phục vụ nghiên cứu. Xổ số là trò chơi may rủi có kỳ vọng âm.</footer>`);
}

function initApp() {
  document.getElementById("gen").textContent = "· cập nhật " + DATA.generated;
  document.getElementById("views").innerHTML = VIEWS.map(([k, l]) => `<button class="view-btn" data-v="${k}">${l}</button>`).join("");
  document.querySelectorAll(".view-btn").forEach((b) => b.addEventListener("click", () => { navigate(b.dataset.v); window.scrollTo(0, 0); }));
  document.getElementById("tabs").innerHTML = ORDER.filter((k) => DATA.games[k]).map((k) =>
    `<button class="tab" role="tab" data-k="${k}" aria-selected="false">${DATA.games[k].meta.name}</button>`).join("");
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => navigate(state.view, b.dataset.k)));
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    store("vl-theme", root.dataset.theme);
    render();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  window.addEventListener("resize", () => charts.forEach((c) => c.resize()));
  window.addEventListener("hashchange", () => { parseHash(); render(); });
  const t = store("vl-theme");
  if (t) document.documentElement.dataset.theme = t;
  const g = store("vl-tab");
  if (g && DATA.games[g]) state.game = g;
  parseHash();
  initPopup();
  navigate();
}
initApp();

</script>
