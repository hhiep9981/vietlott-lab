<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietlott Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-1-soft: #cde2fb;
  --ref: #52514e;
  --div-neg-2: #184f95; --div-neg-1: #86b6ef; --div-mid: #f0efec;
  --div-pos-1: #f3a9a8; --div-pos-2: #b8302f;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b;
  --ball: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-1-soft: #104281; --ref: #c3c2b7;
    --div-neg-2: #6da7ec; --div-neg-1: #1c5cab; --div-mid: #383835;
    --div-pos-1: #9b2f2e; --div-pos-2: #f08b8a;
    --good-text: #0ca30c; --ball: #262624;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-1-soft: #104281; --ref: #c3c2b7;
  --div-neg-2: #6da7ec; --div-neg-1: #1c5cab; --div-mid: #383835;
  --div-pos-1: #9b2f2e; --div-pos-2: #f08b8a;
  --good-text: #0ca30c; --ball: #262624;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 64px; }
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--page);
  border-bottom: 1px solid var(--border);
}
.top-inner {
  max-width: 1280px; margin: 0 auto; padding: 12px 16px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.brand { font-weight: 650; font-size: 16px; margin-right: auto; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab, .seg button, .theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit;
}
.tab[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--ink); color: var(--page); border-color: var(--ink);
}
.theme-btn { padding: 6px 10px; }
.notice {
  margin: 20px 0 8px; padding: 12px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
}
.notice b { color: var(--ink); }
h2 { font-size: 18px; margin: 36px 0 4px; font-weight: 650; }
h2 + p.lede { margin: 0 0 14px; color: var(--ink-2); max-width: 820px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.grid.tiles { grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; min-width: 0;
}
.card.wide { grid-column: 1 / -1; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .sub { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
.card-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 4px; }
.seg button { padding: 3px 10px; font-size: 12.5px; }
.chart { width: 100%; height: 300px; }
.chart.tall { height: 420px; }
.chart.sq { height: 520px; }
.tile .label { color: var(--ink-2); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.verdict.ok { color: var(--good-text); }
.verdict.bad { color: var(--critical); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.balls { display: flex; gap: 6px; flex-wrap: wrap; }
.ball {
  width: 34px; height: 34px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; font-weight: 600;
  border: 1.5px solid var(--series-1); background: var(--ball); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ball.sp { border-color: var(--div-pos-2); }
.ball.sm { width: 26px; height: 26px; font-size: 12px; }
.ticket { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.ticket:last-child { border-bottom: 0; }
.ticket .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
ul.facts { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); }
ul.facts li { margin: 4px 0; }
.legend-inline { display: flex; gap: 14px; color: var(--ink-2); font-size: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.line { height: 2px; vertical-align: 3px; }
footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
@media (max-width: 600px) {
  .chart { height: 260px; } .chart.sq { height: 380px; }
  .tile .value { font-size: 22px; }
}
</style>
</head>

const fmt = (x, d = 0) => x == null ? "–" : Number(x).toLocaleString("vi-VN", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (x, d = 1) => x == null ? "–" : fmt(x * 100, d) + "%";
const vnd = (x) => {
  if (x >= 1e9) return fmt(x / 1e9, x % 1e9 ? 1 : 0) + " tỷ";
  if (x >= 1e6) return fmt(x / 1e6, 0) + " triệu";
  return fmt(x) + "đ";
};
const pval = (p) => p < 0.001 ? "<0,001" : fmt(p, 3);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function baseOption() {
  return {
    animation: false,
    textStyle: { fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif', color: css("--ink-2") },
    grid: { left: 8, right: 16, top: 24, bottom: 8, containLabel: true },
    tooltip: {
      trigger: "axis", confine: true,
      backgroundColor: css("--surface"), borderColor: css("--border"),
      textStyle: { color: css("--ink"), fontSize: 12 },
      axisPointer: { type: "shadow", shadowStyle: { color: css("--grid"), opacity: 0.5 } },
    },
  };
}
function axis(extra = {}) {
  return Object.assign({
    axisLine: { lineStyle: { color: css("--axis") } },
    axisTick: { show: false },
    axisLabel: { color: css("--muted"), fontSize: 11 },
    splitLine: { lineStyle: { color: css("--grid"), width: 1 } },
    nameTextStyle: { color: css("--muted"), fontSize: 11 },

}
function mk(id, option) {
  const el = document.getElementById(id);
  if (!el) return;
  const c = echarts.init(el, null, { renderer: "svg" });

const barStyle = () => ({ color: css("--series-1"), borderRadius: [4, 4, 0, 0] });
const refLine = (value, label) => ({
  silent: true, symbol: "none",
  lineStyle: { color: css("--ref"), type: "solid", width: 1.5 },

});

/* bar of observed counts with scalar or per-category expected */
function obsVsExp(id, cats, obs, exp, opts = {}) {
  const series = [{
    name: opts.obsName || "Quan sát", type: "bar", data: obs, barCategoryGap: "20%",
    itemStyle: barStyle(),
  }];
  if (Array.isArray(exp)) {
    series.push({
      name: "Kỳ vọng (ngẫu nhiên)", type: "line", data: exp, symbol: "circle", symbolSize: 8,
      lineStyle: { color: css("--ref"), width: 2 }, itemStyle: { color: css("--ref"), borderColor: css("--surface"), borderWidth: 2 },
    });
  } else if (exp != null) {
    series[0].markLine = refLine(exp, "Kỳ vọng " + fmt(exp, 1));
  }
  mk(id, {
    xAxis: axis({ type: "category", data: cats, name: opts.xName, nameLocation: "middle", nameGap: 26, splitLine: { show: false } }),
    yAxis: axis({ type: "value", name: opts.yName, min: opts.yMin }),
    series,
    tooltip: opts.tooltip || {},
  });
}

/* ---------- per-visitor generator: unseen-pool rules, seeded PRNG ----------
   Mirrors src/models/unseen_pool.py. Seed = device id (random, localStorage)
   + VN date + product + regeneration counter. No IP or personal data. */
const memStore = {}; // fallback when localStorage is blocked (private mode)
function store(k, v) {
  if (v === undefined) {
    try { const x = localStorage.getItem(k); if (x !== null) return x; } catch (e) {}
    return memStore[k] ?? null;
  }
  memStore[k] = v;
  try { localStorage.setItem(k, v); } catch (e) {}
  return null;
}
function deviceId() {
  let id = store("vl-device");
  if (!id) {
    id = Array.from(crypto.getRandomValues(new Uint32Array(2)), (x) => x.toString(16).padStart(8, "0")).join("");
    store("vl-device", id);
  }
  return id;
}
const todayVN = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
function hash32(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}
function mulberry32(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function modeWeights(z, mode, k) {
  const w = z.map((v) => (mode === "hot" ? Math.exp(k * v) : mode === "cold" ? Math.exp(-k * v) : Math.exp(-0.5 * k * v * v)));
  const s = w.reduce((a, b) => a + b, 0);
  return w.map((v) => v / s);
}
function splitModes(n, split) {
  const keys = Object.keys(split);
  const alloc = Object.fromEntries(keys.map((m) => [m, Math.floor(n * split[m])]));
  const left = n - keys.reduce((a, m) => a + alloc[m], 0);
  [...keys].sort((a, b) => (n * split[b] - alloc[b]) - (n * split[a] - alloc[a])).slice(0, left).forEach((m) => alloc[m]++);
  return keys.flatMap((m) => Array(alloc[m]).fill(m));
}
function weightedPick(rng, w, k) { // Gumbel top-k = weighted sampling without replacement
  return w.map((v, i) => [Math.log(v) - Math.log(-Math.log(rng() || 1e-12)), i])
    .sort((a, b) => b[0] - a[0]).slice(0, k).map((x) => x[1] + 1).sort((a, b) => a - b);
}
function passesRules(t, R) {
  const sum = t.reduce((a, b) => a + b, 0);
  const odd = t.filter((v) => v % 2).length;
  const low = t.filter((v) => v <= R.low_max).length;
  const gaps = t.slice(1).map((v, i) => v - t[i]);
  return sum >= R.sum_lo && sum <= R.sum_hi && R.odd_ok.includes(odd) && R.low_ok.includes(low)
    && Math.max(...gaps) <= R.max_gap && gaps.filter((g) => g === 1).length <= R.max_adjacent;
}
function generateTickets(U, seedStr, n = 10) {
  const C = U.client, R = U.rules;
  const rng = mulberry32(hash32(seedStr));
  const history = new Set(C.history);
  const out = [];
  for (const mode of splitModes(n, C.split)) {
    const w = modeWeights(C.freq_z, mode, C.strength);
    let overlap = C.max_overlap, t = null;
    for (let i = 0; i < 40000 && !t; i++) {
      if (i === 20000) overlap++; // relax diversification before giving up
      const c = weightedPick(rng, w, C.pick);
      if (!passesRules(c, R) || history.has(c.join("-"))) continue;
      if (out.some((o) => o.numbers.filter((x) => c.includes(x)).length > overlap)) continue;
      t = c;
    }
    if (!t) throw new Error("No ticket satisfies the rules");
    const special = C.special_pool ? weightedPick(rng, modeWeights(C.special_z, mode, C.strength), 1)[0] : null;
    const sum = t.reduce((a, b) => a + b, 0);
    const fz = t.map((v) => C.freq_z[v - 1]);
    out.push({
      numbers: t, special, mode, sum,
      sum_z: (sum - C.sum_mean) / C.sum_sd,
      odd: t.filter((v) => v % 2).length,
      low: t.filter((v) => v <= R.low_max).length,
      gaps: t.slice(1).map((v, i) => v - t[i]),
      freq_z: fz,
      mean_freq_z: fz.reduce((a, b) => a + b, 0) / fz.length,
    });
  }
  return out;
}
function renderMyTickets(key, U) {
  const day = todayVN();
  const ckey = `vl-gen-${key}-${day}`;
  const counter = parseInt(store(ckey) || "0", 10) || 0;
  const dev = deviceId();
  const tickets = generateTickets(U, `${dev}|${key}|${day}|${counter}`);
  const sign = (v) => (v >= 0 ? "+" : "") + fmt(v, 2);
  document.getElementById("my-meta").textContent = `Ngày ${day} · mã thiết bị ${dev.slice(0, 6)} · lần tạo #${counter + 1}`;
  document.getElementById("my-tickets").innerHTML = `<table><thead><tr><th>Nhóm</th><th>Bộ số</th><th class="num">Tổng (z)</th><th class="num">Lẻ / Nhỏ</th><th>Khoảng cách</th><th class="num">Tần suất TB (z)</th></tr></thead><tbody>
    ${["hot", "cold", "balanced"].map((m) => tickets.filter((t) => t.mode === m).map((t, i) => `<tr>
      <td>${i === 0 ? `<b>${MODE_LABEL[m]}</b><div style="color:var(--muted);font-size:12px">${MODE_NOTE[m]}</div>` : ""}</td>
      <td><div class="balls">${t.numbers.map((v) => `<span class="ball sm">${v}</span>`).join("")}${t.special ? `<span class="ball sm sp" title="Số đặc biệt">${t.special}</span>` : ""}</div></td>
      <td class="num">${t.sum} (${sign(t.sum_z)})</td>
      <td class="num">${t.odd} / ${t.low}</td>
      <td style="font-variant-numeric:tabular-nums">${t.gaps.join(" · ")}</td>
      <td class="num" title="${t.freq_z.map((v) => fmt(v, 2)).join(", ")}">${sign(t.mean_freq_z)}</td></tr>`).join("")).join("")}
    </tbody></table>`;
  document.getElementById("my-new").onclick = () => { store(ckey, String(counter + 1)); renderMyTickets(key, U); };
  document.getElementById("my-reset").onclick = () => { store(ckey, "0"); renderMyTickets(key, U); };
  window.__vlTickets = tickets; // for inspection
}

function render(key) {
  charts.splice(0).forEach((c) => c.dispose());
  current = key;
  const G = DATA.games[key];
  const M = G.meta;
  const isKeno = key === "keno";
  const nums = G.frequency.numbers;
  const tests = G.tests;
  const nSig = tests.filter((t) => t.p_bonferroni < 0.05).length;
  const bt = G.backtest ? G.backtest.results : [];
  const btSig = bt.filter((r) => r.p_holm < 0.05 && r.lift_pct > 0);
  const best = bt.length ? bt.reduce((a, b) => (b.lift_pct > a.lift_pct ? b : a)) : null;

  let valueTile, valueTile2;
  if (isKeno) {
    const b = G.value.rtp_table.reduce((a, r) => (r.rtp > a.rtp ? r : a));
    valueTile = tile("Bậc có tỷ lệ hoàn trả cao nhất", "Bậc " + b.spot, `Hoàn trả ${pct(b.rtp)} (sau thuế)`);
    const w = G.value.rtp_table.reduce((a, r) => (r.rtp < a.rtp ? r : a));
    valueTile2 = tile("Bậc kém nhất", "Bậc " + w.spot, `Hoàn trả ${pct(w.rtp)}`);
  } else {
    valueTile = tile("Hoàn trả kỳ vọng / vé", pct(G.value.rtp_min_jackpot), "Jackpot ở mức tối thiểu, sau thuế");
    valueTile2 = tile("Jackpot hòa vốn", vnd(G.value.breakeven_jackpot), "Mức để kỳ vọng = giá vé (chưa tính chia giải)");
  }

  let html = `
  <div class="notice"><b>Đọc trước:</b> Mỗi kỳ quay độc lập; không phương pháp chọn số nào làm tăng xác suất trúng.
  Dashboard này kiểm chứng điều đó trên dữ liệu thật và chỉ ra những gì <i>thật sự</i> tối ưu được:
  chọn bậc/sản phẩm hoàn trả cao hơn, thời điểm Jackpot lớn, và bộ số ít người chọn để không phải chia giải.</div>

  <div class="grid tiles">
    ${tile("Số kỳ quay", fmt(M.n_draws), `${M.date_from} → ${M.date_to}`)}
    ${tile("Kiểm định ngẫu nhiên", `<span class="verdict ${nSig ? "bad" : "ok"}">${nSig ? "⚠ " + nSig + " lệch" : "✓ Không lệch"}</span>`, `${tests.length} kiểm định, hiệu chỉnh Bonferroni`)}
    ${tile("Chiến lược thắng Random", `<span class="verdict ${btSig.length ? "bad" : "ok"}">${btSig.length ? btSig.length : "0"} / ${bt.length}</span>`, best ? `Tốt nhất: ${best.strategy} (${best.lift_pct >= 0 ? "+" : ""}${fmt(best.lift_pct, 2)}%, p<sub>Holm</sub>=${pval(best.p_holm)})` : "")}
    ${valueTile}
    ${valueTile2}
  </div>

  <h2>Tần suất xuất hiện</h2>
  <p class="lede">Số lần mỗi số được quay. Với dữ liệu ngẫu nhiên, các cột dao động quanh đường kỳ vọng — chênh lệch nằm trong biên độ dao động bình thường không mang thông tin dự đoán.</p>
  <div class="grid">
    <div class="card wide"><div class="card-head"><div><h3>Tần suất theo số</h3><p class="sub" id="freq-sub"></p></div>
      <div class="seg" id="freq-seg"><button aria-pressed="true" data-v="all">Toàn bộ</button><button aria-pressed="false" data-v="recent">${fmt(G.frequency.recent_n)} kỳ gần nhất</button></div></div>
      ${legendInline()}<div id="c-freq" class="chart"></div></div>
  </div>

  <h2>Khoảng cách giữa các lần xuất hiện</h2>
  <p class="lede">Số kỳ giữa hai lần một số được quay. Nếu ngẫu nhiên, khoảng cách tuân theo phân phối hình học với trung bình ${fmt(G.gaps.expected_mean, 2)} kỳ. Một số "lâu chưa về" không có khả năng về cao hơn ở kỳ sau.</p>
  <div class="grid">
    ${card("c-gapcur", "Số kỳ chưa về (hiện tại)", "Rê chuột để xem khoảng cách trung bình, lớn nhất và xác suất vắng lâu như vậy.", "wide")}
    <div class="card wide"><h3>Phân phối khoảng cách (tất cả các số)</h3><p class="sub">So với phân phối hình học lý thuyết.</p>${legendInline()}<div id="c-gaphist" class="chart"></div></div>
  </div>

  <h2>Cặp số &amp; bộ ba đi cùng nhau</h2>
  <p class="lede">Tỷ lệ số lần hai số cùng xuất hiện trong một kỳ so với kỳ vọng (${fmt(G.pairs.expected, 1)} lần/cặp). Đỏ = nhiều hơn kỳ vọng, xanh = ít hơn.</p>
  <div class="grid">
    ${card("c-pairs", "Ma trận cặp số (quan sát / kỳ vọng)", "", "sq")}
    <div class="card"><h3>Các cặp xuất hiện nhiều nhất</h3><p class="sub">Kỳ vọng ${fmt(G.pairs.expected, 1)} lần/cặp. Cặp đứng đầu luôn tồn tại kể cả khi hoàn toàn ngẫu nhiên.</p>
      <div class="scroll"><table><thead><tr><th>Cặp</th><th class="num">Số lần</th><th class="num">So với kỳ vọng</th></tr></thead><tbody>
      ${G.pairs.top.slice(0, 12).map((r) => `<tr><td>${r.a} – ${r.b}</td><td class="num">${fmt(r.count)}</td><td class="num">${(r.count / G.pairs.expected * 100 - 100 >= 0 ? "+" : "") + fmt(r.count / G.pairs.expected * 100 - 100, 0)}%</td></tr>`).join("")}
      </tbody></table></div>
      ${G.triplets ? `<h3 style="margin-top:16px">Bộ ba xuất hiện nhiều nhất</h3><p class="sub">Kỳ vọng ${fmt(G.triplets.expected, 2)} lần/bộ.</p>
      <div class="scroll"><table><thead><tr><th>Bộ ba</th><th class="num">Số lần</th></tr></thead><tbody>
      ${G.triplets.top.slice(0, 8).map((r) => `<tr><td>${r.combo.join(" – ")}</td><td class="num">${r.count}</td></tr>`).join("")}
      </tbody></table></div>` : ""}
    </div>
  </div>

  <h2>Cấu trúc mỗi kỳ quay</h2>
  <p class="lede">Hình dạng bộ số trúng: tổng, chẵn/lẻ, nhỏ/lớn, số liên tiếp, số lặp lại từ kỳ trước. Đường xám là phân phối kỳ vọng nếu quay ngẫu nhiên (mô phỏng/siêu bội).</p>
  ${legendInline()}
  <div class="grid">
    ${card("c-sum", "Tổng các số", `80% kỳ quay ngẫu nhiên có tổng trong khoảng ${fmt(G.structure.sum.p10)}–${fmt(G.structure.sum.p90)}.`)}
    ${card("c-odd", "Số lượng số lẻ", "")}
    ${card("c-low", `Số lượng số nhỏ (≤ ${Math.floor(M.pool / 2)})`, "")}
    ${card("c-consec", "Số cặp số liên tiếp", "Ví dụ 12–13 tính là 1 cặp.")}
    ${card("c-repeat", "Số lặp lại từ kỳ trước", "")}
    ${card("c-bucket", "Theo nhóm 10 số", "")}
  </div>

  <h2>Biến động theo thời gian</h2>
  <p class="lede">Chênh lệch tần suất của từng số theo ${isKeno ? "quý" : "năm"}, so với kỳ vọng (bỏ các giai đoạn chưa đủ dữ liệu). Các ô đậm màu xuất hiện rải rác, không lặp lại theo thời gian — dấu hiệu của nhiễu ngẫu nhiên.</p>
  <div class="grid">${card("c-heat", "Chênh lệch tần suất (%) theo số × thời gian", "", "wide tall")}</div>

  ${G.special ? `<h2>${G.special.label}</h2><div class="grid">${card("c-special", G.special.label, "Tần suất so với kỳ vọng.", "wide")}</div>` : ""}
  ${isKeno ? `<h2>Keno: Lớn/Nhỏ &amp; Chẵn/Lẻ</h2><p class="lede">Số lượng số lớn (41–80) và số chẵn trong 20 số mỗi kỳ.</p><div class="grid">${card("c-big", "Số lượng số lớn (41–80)", "")}${card("c-even", "Số lượng số chẵn", "")}</div>` : ""}

  <h2>Kiểm định tính ngẫu nhiên</h2>
  <p class="lede">p-value nhỏ (&lt; 0,05 sau hiệu chỉnh) là bằng chứng có quy luật khai thác được. p-value lớn = không phát hiện quy luật.</p>
  <div class="card scroll"><table><thead><tr><th>Kiểm định</th><th class="num">p-value</th><th class="num">p (Bonferroni)</th><th>Kết luận</th><th>Chi tiết</th></tr></thead><tbody>
  ${tests.map((t) => `<tr><td>${esc(t.test)}</td><td class="num">${pval(t.p_value)}</td><td class="num">${pval(t.p_bonferroni)}</td>
    <td><span class="verdict ${t.p_bonferroni < 0.05 ? "bad" : "ok"}">${t.p_bonferroni < 0.05 ? "⚠ Lệch" : "✓ Ngẫu nhiên"}</span></td><td style="color:var(--muted)">${esc(t.detail)}</td></tr>`).join("")}
  </tbody></table></div>

  ${bt.length ? `
  <h2>Backtest chiến lược (walk-forward)</h2>
  <p class="lede">${esc(G.backtest.game)} · ${fmt(bt[0].n_draws)} kỳ (${bt[0].date_from} → ${bt[0].date_to}) · ${bt[0].n_tickets} vé/kỳ · mỗi kỳ chỉ dùng dữ liệu trước đó.
  "Lift" = số trúng trung bình mỗi vé so với chọn ngẫu nhiên. Một chiến lược chỉ có giá trị nếu khoảng tin cậy 95% nằm hẳn bên phải 0.</p>
  <div class="grid">
    ${card("c-lift", "Lift so với ngẫu nhiên (%), khoảng tin cậy 95%", "Chấm = ước lượng, thanh = khoảng tin cậy 95%.", "wide")}
    <div class="card wide scroll"><h3>Kết quả tài chính</h3><p class="sub">ROI tính theo bảng thưởng chính thức, Jackpot ở mức tối thiểu. Một lần trúng Jackpot sẽ chi phối ROI — xem cột "Jackpot".</p>
    <table><thead><tr><th>Chiến lược</th><th class="num">TB số trúng/vé</th><th class="num">Lift</th><th class="num">p (Holm)</th><th class="num">Chi phí</th><th class="num">Tiền thưởng</th><th class="num">ROI</th><th class="num">ROI sau thuế</th><th class="num">Jackpot</th></tr></thead><tbody>
    ${bt.map((r) => `<tr><td>${esc(r.strategy)}</td><td class="num">${fmt(r.mean_matches, 4)}</td><td class="num">${r.lift_pct >= 0 ? "+" : ""}${fmt(r.lift_pct, 2)}%</td><td class="num">${pval(r.p_holm)}</td><td class="num">${vnd(r.cost)}</td><td class="num">${vnd(r.gross_gain)}</td><td class="num">${fmt(r.roi_gross_pct, 1)}%</td><td class="num">${fmt(r.roi_taxed_pct, 1)}%</td><td class="num">${r.jackpot_hits}</td></tr>`).join("")}
    </tbody></table></div>
  </div>` : ""}

  <h2>Giá trị kỳ vọng — chơi khi nào, chơi gì</h2>
  ${isKeno ? `<p class="lede">Keno trả thưởng cố định nên tỷ lệ hoàn trả chỉ phụ thuộc vào bậc chơi, không phụ thuộc số chọn. Chọn bậc có hoàn trả cao nhất là cách "tối ưu" duy nhất.</p>
    <div class="grid">${card("c-rtp", "Tỷ lệ hoàn trả theo bậc (sau thuế)", "Tỷ lệ tiền thưởng kỳ vọng trên mỗi 10.000đ.")}
    <div class="card scroll"><h3>Chi tiết theo bậc</h3><table><thead><tr><th>Bậc</th><th class="num">Hoàn trả</th><th class="num">P(trúng bất kỳ)</th><th class="num">Giải cao nhất</th><th class="num">Xác suất giải cao nhất</th></tr></thead><tbody>
    ${G.value.rtp_table.map((r) => `<tr><td>${r.spot}</td><td class="num">${pct(r.rtp)}</td><td class="num">${pct(r.p_any_prize)}</td><td class="num">${vnd(r.top_prize)}</td><td class="num">1/${fmt(1 / r.p_top)}</td></tr>`).join("")}
    </tbody></table></div></div>`
  : `<p class="lede">Tiền thưởng kỳ vọng mỗi vé tăng theo giá trị Jackpot. Vé chỉ "đáng giá" (kỳ vọng ≥ giá vé) khi Jackpot vượt mức hòa vốn — và ngay cả khi đó vẫn có rủi ro phải chia giải.</p>
    <div class="grid">${card("c-ev", "Hoàn trả kỳ vọng theo giá trị Jackpot (sau thuế)", `Hòa vốn khi Jackpot ≈ ${vnd(G.value.breakeven_jackpot)}.`)}
    <div class="card scroll"><h3>Cơ cấu giải &amp; xác suất</h3><table><thead><tr><th>Điều kiện</th><th class="num">Giải thưởng</th><th class="num">Xác suất</th></tr></thead><tbody>
    ${G.value.tiers.map((t) => `<tr><td>${t.matches} số${t.special === true ? " + số ĐB" : ""}${key === "power535" && t.matches < 3 ? " (trùng số ĐB)" : ""}</td><td class="num">${vnd(t.prize)}${t.prize >= 1e9 ? "+" : ""}</td><td class="num">1/${fmt(t.odds)}</td></tr>`).join("")}
    </tbody></table></div></div>`}

  <h2>Gợi ý bộ số</h2>
  ${isKeno ? `<p class="lede">Bậc ${G.suggest.spot} (hoàn trả ${pct(G.suggest.best.rtp)}). Số chọn ngẫu nhiên đều — với Keno, mọi bộ số có giá trị như nhau.</p>`
  : `<p class="lede">Các vé được chọn ngẫu nhiên trong 5% bộ số ít phổ biến nhất (tránh dải ngày sinh 1–31, số may mắn, cấp số cộng, chuỗi liên tiếp, lặp kỳ trước) và trùng nhau tối đa ${Math.max(1, Math.floor(M.drawn / 3))} số. Xác suất trúng không đổi, nhưng nếu trúng Jackpot thì ít khả năng phải chia.</p>`}
  <div class="card">${(isKeno ? G.suggest.tickets.map((t) => ({ numbers: t })) : G.suggest.tickets).map((t, i) => `
    <div class="ticket"><div class="balls">${t.numbers.map((n) => `<span class="ball">${String(n).padStart(2, "0")}</span>`).join("")}${t.special ? `<span class="ball sp" title="Số đặc biệt">${String(t.special).padStart(2, "0")}</span>` : ""}</div>
    <div class="meta">Vé ${i + 1}${t.popularity != null ? ` · điểm phổ biến ${fmt(t.popularity, 1)}` : ""}</div></div>`).join("")}</div>

  ${G.unseen_pool ? unseenPoolSection(G, bt) : ""}

  <h2>Kết quả gần nhất</h2>
  <div class="card scroll"><table><thead><tr><th>Ngày</th><th>Kỳ</th><th>Bộ số</th></tr></thead><tbody>
  ${G.recent_draws.slice(0, isKeno ? 15 : 20).map((d) => `<tr><td>${d.date}</td><td>#${d.id}</td><td><div class="balls">${d.main.map((n) => `<span class="ball sm">${n}</span>`).join("")}${d.special ? `<span class="ball sm sp">${d.special}</span>` : ""}</div></td></tr>`).join("")}
  </tbody></table></div>
  <footer>Dữ liệu: vietlott-data · Tạo lúc ${DATA.generated} · Chỉ phục vụ nghiên cứu. Xổ số là trò chơi may rủi có kỳ vọng âm.</footer>`;

  document.getElementById("app").innerHTML = html;
  drawCharts(key, G);
  if (G.unseen_pool && G.unseen_pool.client) renderMyTickets(key, G.unseen_pool);
}

function drawCharts(key, G) {
  const M = G.meta;
  const nums = G.frequency.numbers;
  const isKeno = key === "keno";

  const drawFreq = (mode) => {
    const F = G.frequency;
    const obs = mode === "all" ? F.all : F.recent;
    const exp = mode === "all" ? F.all_expected : F.recent_expected;
    document.getElementById("freq-sub").textContent = mode === "all"
      ? `${fmt(M.n_draws)} kỳ · kỳ vọng ${fmt(exp, 1)} lần/số`
      : `${fmt(F.recent_n)} kỳ gần nhất · kỳ vọng ${fmt(exp, 1)} lần/số`;
    const idx = charts.findIndex((c) => c.getDom().id === "c-freq");
    if (idx >= 0) charts.splice(idx, 1)[0].dispose();
    obsVsExp("c-freq", nums, obs, exp, {
      tooltip: { formatter: (p) => `Số <b>${p[0].name}</b><br>${p[0].value} lần · ${(p[0].value / exp * 100 - 100 >= 0 ? "+" : "")}${fmt(p[0].value / exp * 100 - 100, 1)}% so với kỳ vọng${mode === "recent" ? `<br>z = ${fmt(F.recent_z[p[0].dataIndex], 2)}` : ""}` },
    });
  };
  drawFreq("all");
  document.querySelectorAll("#freq-seg button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#freq-seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    drawFreq(b.dataset.v);
  }));

  const Gp = G.gaps;
  obsVsExp("c-gapcur", nums, Gp.current, Gp.expected_mean, {
    tooltip: { formatter: (p) => { const i = p[0].dataIndex; return `Số <b>${p[0].name}</b><br>Chưa về: ${Gp.current[i]} kỳ<br>TB khoảng cách: ${fmt(Gp.mean[i], 1)} · lớn nhất: ${Gp.max[i]}<br>P(vắng ≥ ${Gp.current[i]} kỳ) = ${pct(Gp.p_absent[i], 2)}`; } },
  });
  obsVsExp("c-gaphist", Gp.hist_k.map((k, i) => (i === Gp.hist_k.length - 1 ? "≥" + k : String(k))), Gp.hist_obs, Gp.hist_exp, { xName: "Khoảng cách (kỳ)" });

  // pair matrix
  const P = G.pairs.ratio;
  const cells = [];
  for (let i = 0; i < P.length; i++) for (let j = 0; j < P.length; j++) if (P[i][j] != null) cells.push([j, i, P[i][j]]);
  const spread = isKeno ? 0.08 : 0.8;
  mk("c-pairs", {
    grid: { left: 8, right: 8, top: 8, bottom: 48, containLabel: true },
    tooltip: { trigger: "item", formatter: (p) => `Cặp <b>${nums[p.value[1]]} – ${nums[p.value[0]]}</b><br>${fmt(p.value[2] * G.pairs.expected, 0)} lần (×${fmt(p.value[2], 2)} kỳ vọng)` },
    xAxis: axis({ type: "category", data: nums, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 9, interval: isKeno ? 9 : 4 } }),
    yAxis: axis({ type: "category", data: nums, inverse: true, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 9, interval: isKeno ? 9 : 4 } }),
    visualMap: Object.assign(divergingMap(1 - spread, 1 + spread, 2), { text: [`×${fmt(1 + spread, 2)}`, `×${fmt(1 - spread, 2)}`] }),
    series: [{ type: "heatmap", data: cells, progressive: 0, itemStyle: { borderColor: css("--surface"), borderWidth: isKeno ? 0 : 0.5 } }],
  });

  const S = G.structure;
  const sumCats = S.sum.bins.map((b) => S.sum.width > 1 ? `${b}–${b + S.sum.width - 1}` : String(b));
  obsVsExp("c-sum", sumCats, S.sum.obs, S.sum.exp, {});
  obsVsExp("c-odd", S.odd.k, S.odd.obs, S.odd.exp, {});
  obsVsExp("c-low", S.low.k, S.low.obs, S.low.exp, {});
  obsVsExp("c-consec", S.consec.k, S.consec.obs, S.consec.exp, {});
  obsVsExp("c-repeat", S.repeat.k, S.repeat.obs, S.repeat.exp, {});
  obsVsExp("c-bucket", S.buckets.labels, S.buckets.obs, S.buckets.exp, {});

  const H = G.heatmap;
  const lim = isKeno ? 6 : 60;
  mk("c-heat", {
    grid: { left: 8, right: 8, top: 8, bottom: 56, containLabel: true },
    tooltip: { trigger: "item", formatter: (p) => `Số <b>${nums[p.value[1]]}</b> · ${H.periods[p.value[0]]}<br>${p.value[3]} lần (${p.value[2] >= 0 ? "+" : ""}${fmt(p.value[2], 1)}% so với kỳ vọng)<br>${H.draws_per_period[p.value[0]]} kỳ quay` },
    xAxis: axis({ type: "category", data: H.periods, splitLine: { show: false } }),
    yAxis: axis({ type: "category", data: nums, inverse: true, splitLine: { show: false }, axisLabel: { color: css("--muted"), fontSize: 9, interval: isKeno ? 4 : 1 } }),
    visualMap: Object.assign(divergingMap(-lim, lim, 2), { text: [`+${lim}%`, `−${lim}%`] }),
    series: [{ type: "heatmap", data: H.cells, progressive: 0, itemStyle: { borderColor: css("--surface"), borderWidth: 1 } }],
  });

  if (G.special) obsVsExp("c-special", G.special.numbers, G.special.counts, G.special.expected, {});
  if (G.keno_sides) {
    obsVsExp("c-big", G.keno_sides.k, G.keno_sides.big, G.keno_sides.exp, {});
    obsVsExp("c-even", G.keno_sides.k, G.keno_sides.even, G.keno_sides.exp, {});
  }

  if (G.backtest) {
    const R = G.backtest.results;
    const names = R.map((r) => r.strategy);
    mk("c-lift", {
      grid: { left: 8, right: 24, top: 28, bottom: 8, containLabel: true },
      tooltip: { trigger: "item", formatter: (p) => { const r = R[p.dataIndex]; return `<b>${esc(r.strategy)}</b><br>Lift ${r.lift_pct >= 0 ? "+" : ""}${fmt(r.lift_pct, 2)}%<br>CI 95%: [${fmt(r.lift_ci95[0], 2)}, ${fmt(r.lift_ci95[1], 2)}]<br>p = ${pval(r.p_value)} · p<sub>Holm</sub> = ${pval(r.p_holm)}`; } },
      xAxis: axis({ type: "value", axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => (v > 0 ? "+" : "") + v + "%" } }),
      yAxis: axis({ type: "category", data: names, inverse: true, splitLine: { show: false } }),
      series: [
        {
          type: "custom", silent: true,
          renderItem: (params, api) => {
            const a = api.coord([api.value(0), api.value(2)]);
            const b = api.coord([api.value(1), api.value(2)]);
            return { type: "line", shape: { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, style: { stroke: css("--series-1"), lineWidth: 2, opacity: 0.55 } };
          },
          data: R.map((r, i) => [r.lift_ci95[0], r.lift_ci95[1], i]),
          encode: { x: [0, 1], y: 2 },
          z: 1,
        },
        {
          type: "scatter", data: R.map((r, i) => [r.lift_pct, i]), symbolSize: 10, z: 2,
          itemStyle: { color: css("--series-1"), borderColor: css("--surface"), borderWidth: 2 },
          markLine: { silent: true, symbol: "none", lineStyle: { color: css("--ref"), type: "solid", width: 1.5 }, label: { formatter: "Ngẫu nhiên", color: css("--ink-2"), fontSize: 11, position: "start" }, data: [{ xAxis: 0 }] },
        },
      ],
    });
  }

  if (isKeno) {
    const T = G.value.rtp_table;
    mk("c-rtp", {
      tooltip: { formatter: (p) => `Bậc ${p[0].name}: hoàn trả ${pct(p[0].value)}` },
      xAxis: axis({ type: "category", data: T.map((r) => r.spot), name: "Bậc", nameLocation: "middle", nameGap: 26, splitLine: { show: false } }),
      yAxis: axis({ type: "value", min: 0, max: 0.6, axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => fmt(v * 100) + "%" } }),
      series: [{ type: "bar", data: T.map((r) => r.rtp), itemStyle: barStyle(), barCategoryGap: "25%" }],
    });
  } else {
    const E = G.value.ev_curve;
    const be = G.value.breakeven_jackpot;
    mk("c-ev", {
      grid: { left: 8, right: 24, top: 24, bottom: 8, containLabel: true },
      tooltip: { trigger: "axis", axisPointer: { type: "line", lineStyle: { color: css("--axis") } }, formatter: (p) => `Jackpot ${vnd(p[0].value[0])}<br>Hoàn trả ${pct(p[0].value[1])}` },
      xAxis: axis({ type: "value", name: "Jackpot", nameLocation: "middle", nameGap: 26, axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => fmt(v / 1e9) + " tỷ" } }),
      yAxis: axis({ type: "value", axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => fmt(v * 100) + "%" } }),
      series: [{
        type: "line", showSymbol: false, data: E.jackpot.map((j, i) => [j, E.rtp[i]]),
        lineStyle: { color: css("--series-1"), width: 2 }, itemStyle: { color: css("--series-1") },
        markLine: { silent: true, symbol: "none", lineStyle: { color: css("--ref"), type: "solid", width: 1.5 },
          label: { color: css("--ink-2"), fontSize: 11 },
          data: [{ yAxis: 1, label: { formatter: "Hòa vốn (100%)", position: "insideStartTop" } }, ...(be && be <= E.jackpot[E.jackpot.length - 1] ? [{ xAxis: be, label: { formatter: vnd(be), position: "insideEndTop" } }] : [])] },
      }],
    });
  }
}

function buildTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = ORDER.filter((k) => DATA.games[k]).map((k) =>
    `<button class="tab" role="tab" data-k="${k}" aria-selected="false">${DATA.games[k].meta.name}</button>`).join("");
  nav.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => select(b.dataset.k)));
}
function select(k) {
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.k === k)));
  try { localStorage.setItem("vl-tab", k); } catch (e) {}
  render(k);
}

document.getElementById("gen").textContent = "· cập nhật " + DATA.generated;
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("vl-theme", root.dataset.theme); } catch (e) {}
  render(current);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render(current));
window.addEventListener("resize", () => charts.forEach((c) => c.resize()));
try { const t = localStorage.getItem("vl-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
buildTabs();
let start = "power655";
try { const s = localStorage.getItem("vl-tab"); if (s && DATA.games[s]) start = s; } catch (e) {}
select(start);
</script>
